<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rapport Express</title>
<meta name="theme-color" content="#6D2E46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rapport">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: one-hand field tool — sticky week bar, day tabs, visit list, bottom sheet editor */
:root{
  --bg:#F5F4F6; --surface:#FFFFFF; --ink:#18151B; --muted:#76707C; --line:#E6E2E8;
  --accent:#6D2E46; --accent-soft:#F3E4EA; --accent-ink:#FFFFFF;
  --cl:#2F7A57; --cl-soft:#E1F1E8; --p:#2F5D8A; --p-soft:#E2ECF6; --ncl:#9A5B12; --ncl-soft:#F7EBD9;
  --shadow:0 1px 2px rgba(24,21,27,.06),0 8px 24px rgba(24,21,27,.06);
  --display:"Avenir Next","Avenir","Futura","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141216; --surface:#1E1B21; --ink:#F3F0F5; --muted:#A39CA9; --line:#2F2A33;
  --accent:#E59AB6; --accent-soft:#3A2430; --accent-ink:#1A0F14;
  --cl:#7FD3A6; --cl-soft:#1F3328; --p:#93BCE8; --p-soft:#1E2B39; --ncl:#E9B877; --ncl-soft:#3A2D1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141216; --surface:#1E1B21; --ink:#F3F0F5; --muted:#A39CA9; --line:#2F2A33;
  --accent:#E59AB6; --accent-soft:#3A2430; --accent-ink:#1A0F14;
  --cl:#7FD3A6; --cl-soft:#1F3328; --p:#93BCE8; --p-soft:#1E2B39; --ncl:#E9B877; --ncl-soft:#3A2D1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topin{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.week{display:flex;align-items:center;gap:4px;margin-left:auto}
.week span{font-weight:700;font-size:14px;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.icon{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:72px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:0}
.seg button b{font-size:13px}
.seg button small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.seg .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;text-align:center;line-height:18px;padding:0 5px;margin-left:4px}
.tabs{display:flex;gap:6px}
.tabs button{border:0;background:transparent;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:10px}
.tabs button[aria-pressed="true"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
h1.day{font-family:var(--display);font-weight:500;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em;margin:18px 0 2px;text-wrap:balance}
.sum{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;margin:0 0 18px}
.sum b{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.visit{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.visit:active{transform:scale(.995)}
.visit .t{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.visit .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit .meta{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.amt{font-weight:800;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
.chip.CL{background:var(--cl-soft);color:var(--cl)} .chip.P{background:var(--p-soft);color:var(--p)} .chip.NCL{background:var(--ncl-soft);color:var(--ncl)}
.add{width:100%;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;color:var(--accent);font-weight:800;border-radius:var(--r);padding:16px;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.empty b{color:var(--ink);display:block;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:12px}
section.block{margin-top:28px}
.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=time],input[type=search],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
input:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:#B4233A}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;display:flex;gap:8px}
.fab .btn{box-shadow:var(--shadow);border-radius:999px;padding:13px 20px;font-size:15px}
@media (max-width:560px){.fab{left:max(16px,env(safe-area-inset-left,0px));gap:6px}.fab .btn{flex:1;padding:10px 6px;font-size:13px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:700;min-height:40px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.type button[data-v="CL"][aria-pressed="true"]{background:var(--cl);border-color:var(--cl);color:var(--surface)}
.chips.type button[data-v="P"][aria-pressed="true"]{background:var(--p);border-color:var(--p);color:var(--surface)}
.chips.type button[data-v="NCL"][aria-pressed="true"]{background:var(--ncl);border-color:var(--ncl);color:var(--surface)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,12,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px}
@media (max-width:480px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}.three>:first-child{grid-column:1/-1}}
.sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px}
.sugg button:last-child{border-bottom:0}
.sugg small{color:var(--muted)}
.profile{background:var(--accent-soft);border-radius:14px;padding:12px}
.profile .label{color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.client{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.client .meta{color:var(--muted);font-size:13px}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
.sync{font-size:12px;color:var(--muted);font-weight:600}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.tbl .r{text-align:right}
.example{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ncl);background:var(--ncl-soft);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
</style>

<header class="top">
  <div class="topin">
    <div class="brand"><i></i>Rapport</div>
    <div class="tabs" role="group" aria-label="Vue">
      <button id="tabRep" aria-pressed="true" onclick="setView('rep')">Semaine</button>
      <button id="tabMon" aria-pressed="false" onclick="setView('mon')">Mois</button>
      <button id="tabCli" aria-pressed="false" onclick="setView('cli')">Clients</button>
    </div>
    <div class="week" id="weekNav">
      <button class="icon" id="prevW" aria-label="Semaine précédente" onclick="shiftWeek(-7)">‹</button>
      <span id="weekLbl">—</span>
      <button class="icon" id="nextW" aria-label="Semaine suivante" onclick="shiftWeek(7)">›</button>
    </div>
  </div>
  <div class="wrap" style="padding-block:0" id="segWrap"><div class="seg" id="seg" role="group" aria-label="Jour"></div></div>
</header>

<main class="wrap" id="main"></main>

<div class="fab" id="fab">
  <button class="btn ink" id="pdfBtn" onclick="makePdf('week',this)">Semaine complète</button>
  <button class="btn pri" id="pdfMonthBtn" onclick="makePdf('month',this)">Mois complet</button>
</div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script>
"use strict";
const DAYN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const FRAIS=[['dej','Déjeuner'],['din','Dîner'],['hot','Hôtel'],['park','Parking'],['lav','Lavage'],['ess','Essence'],['aut','Autres']];
const NEXT=['Relance tél.','Envoyer offre','Démo / formation','Échantillons','Revisite < 4 sem.','Revisite normale'];
const POT=[['A','A · Fort'],['B','B · Moyen'],['C','C · Faible']];
const DAYS_CLOSED=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Aucun'];
let S={view:'rep',start:mondayOf(new Date()),day:0,week:null,clients:[],ym:'',settings:{name:'Thomas Serve',company:'DICOPAR SA',sector:'102 / 112'}};
let store=null, uid=null, downloads=null;

/* ---------- utils ---------- */
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return iso(x)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateOf(i){const [y,m,d]=S.start.split('-').map(Number);return new Date(y,m-1,d+i)}
const fmtLong=d=>d.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtShort=d=>d.toLocaleDateString('fr-CH',{day:'numeric',month:'short'});
function num(v){const n=parseFloat(String(v??'').replace(/'/g,'').replace(',','.'));return isFinite(n)?n:0}
function chf(n){const s=(Math.round(n*100)/100).toFixed(2);const [a,b]=s.split('.');return 'CHF '+a.replace(/\B(?=(\d{3})+(?!\d))/g,"'")+'.'+b}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uidGen(){return Math.random().toString(36).slice(2,10)}
function blankDay(){return {km:'',frais:{},comment:'',visits:[]}}
function blankWeek(){return {start:S.start,days:[0,1,2,3,4].map(blankDay)}}
function toast(msg){const h=document.getElementById('toastHost');h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2200)}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();

/* ---------- storage: claude db, or Firebase (version autonome), + localStorage ---------- */
const LS='rapportExpress:';
const FB={key:'AIzaSyD8m1YVvIs4aXx0KUrixCRd-wnbuW5QFNQ',url:'https://firestore.googleapis.com/v1/projects/crm-2026-salons/databases/(default)/documents',col:'rapport'};
const FB_ON=!(window.claude&&window.claude.use);
let syncState={ok:null,at:null,pending:0};
function lsGet(k){try{const r=localStorage.getItem(LS+k);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));return true}catch(e){return false}}
const stamp=k=>Number(lsGet('_meta:'+k)||0);
const pend=()=>lsGet('_pending')||{};
async function fbGet(k){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch(FB.url+'/'+FB.col+'/'+k+'?key='+FB.key,{signal:ctl.signal});
    if(r.status===404) return {missing:true};
    if(!r.ok) return null;
    const d=await r.json(); const f=d.fields||{};
    return {v:JSON.parse(f.data.stringValue),u:Number((f.updated&&(f.updated.integerValue||f.updated.doubleValue))||0)};
  }catch(e){return null}finally{clearTimeout(t)}
}
async function fbPut(k,v,u){
  try{const r=await fetch(FB.url+'/'+FB.col+'/'+k+'?key='+FB.key,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(v)},updated:{integerValue:String(u)}}})});return r.ok}catch(e){return false}
}
async function load(key){
  if(store){try{const s=await store.doc(key).get();return s.exists?s.data().v:null}catch(e){}}
  const local=lsGet(key);
  if(FB_ON&&!pend()[key]){
    const r=await fbGet(key);
    if(r&&!r.missing){syncState.ok=true;syncState.at=new Date();
      if(r.u>stamp(key)){lsSet(key,r.v);lsSet('_meta:'+key,r.u);return r.v}}
    else if(r&&r.missing){syncState.ok=true}
    else syncState.ok=false;
  }
  return local;
}
const timers={};
function save(key,val){
  clearTimeout(timers[key]);
  timers[key]=setTimeout(async()=>{
    const v=JSON.parse(JSON.stringify(val));
    lsSet(key,v);
    if(store){try{await store.doc(key).set({v,at:Date.now()})}catch(e){if(e&&e.code==='quota_exceeded')toast('Stockage plein')}}
    if(FB_ON){const u=Date.now();lsSet('_meta:'+key,u);const p=pend();p[key]=u;lsSet('_pending',p);flush()}
  },500);
}
let flushing=false;
async function flush(){
  if(!FB_ON||flushing) return; flushing=true;
  try{
    const p=pend();
    for(const [k,u] of Object.entries(p)){
      const ok=await fbPut(k,lsGet(k),u);
      if(!ok){syncState.ok=false;break}
      const q=pend(); if(q[k]===u){delete q[k];lsSet('_pending',q)}
      syncState.ok=true; syncState.at=new Date();
    }
  }finally{flushing=false; syncState.pending=Object.keys(pend()).length; showSync()}
}
/* ---------- envoi automatique vers le CRM (version autonome) ---------- */
const CRM_ON=FB_ON;
let crmBusy=false, crmTimer=null, crmState={at:null,err:null,n:0};
function toFS(obj){const fields={};for(const [k,v] of Object.entries(obj)){
  if(v===null||v===undefined)fields[k]={nullValue:null};else if(typeof v==='boolean')fields[k]={booleanValue:v};
  else if(typeof v==='number')fields[k]={doubleValue:v};else if(typeof v==='string')fields[k]={stringValue:v};
  else fields[k]={stringValue:JSON.stringify(v)}}return {fields}}
async function fsPatch(path,obj){try{const r=await fetch(FB.url+'/'+path+'?key='+FB.key,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(toFS(obj))});return r.ok}catch(e){return false}}
async function fsDelete(path){try{const r=await fetch(FB.url+'/'+path+'?key='+FB.key,{method:'DELETE'});return r.ok||r.status===404}catch(e){return false}}
function scheduleCrm(){if(!CRM_ON)return;clearTimeout(crmTimer);crmTimer=setTimeout(pushCrm,4000)}
function localWeeks(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const m=k&&k.match(/^rapportExpress:w(\d{4}-\d\d-\d\d)$/);
  if(m){const w=lsGet('w'+m[1]);if(w&&w.days)out.push({start:m[1],week:w})}}}catch(e){}return out}
function addDaysIso(start,i){const [y,m,d]=start.split('-').map(Number);return iso(new Date(y,m-1,d+i))}
function frDate(isoD){const [y,m,d]=isoD.split('-');return d+'.'+m+'.'+y}
function visitText(v){
  const parts=[];
  if(v.type) parts.push({CL:'Client',P:'Prospect',NCL:'Nouveau client'}[v.type]||v.type);
  if(v.cmd) parts.push('Commande '+(v.cmd==='Tél.'?'tél.':'')+(num(v.amount)?' '+chf(num(v.amount)):'').trim());

async function pushCrm(){
  if(!CRM_ON||crmBusy) return; crmBusy=true;
  try{
    const sent=(await load('crmSent'))||{};
    const today=iso(new Date()); const todo=[];
    localWeeks().forEach(({start,week})=>week.days.forEach((d,i)=>{const date=addDaysIso(start,i); if(date>today) return;
      d.visits.forEach(v=>{if(v.example||!String(v.name||'').trim())return;
        const sig=JSON.stringify([v.name,v.city,v.amount,v.obs,v.next,v.promo,v.type,v.cmd,v.brands,date]);
        const s=sent[v.id]; if(!s||s.del||s.sig!==sig) todo.push({v,date,prev:(s&&!s.del)?s:null,sig})})}));
    const dels=Object.entries(sent).filter(([,s])=>s&&s.del);
    if(!todo.length&&!dels.length){crmState.err=null;return}
    const r=await fetch(FB.url+'/meta/all_clients?key='+FB.key); if(!r.ok) throw new Error('lecture du CRM ('+r.status+')');
    const doc=await r.json(); const raw=doc.fields&&doc.fields.data&&doc.fields.data.stringValue; if(!raw) throw new Error('CRM vide');
    const list=JSON.parse(raw); if(!Array.isArray(list)||!list.length) throw new Error('CRM illisible');
    const byId={}; list.forEach(c=>byId[c.id]=c);
    let clientsChanged=false;
    const comPush=(cc,date,text)=>{let com=[];try{com=typeof cc.comments==='string'?JSON.parse(cc.comments||'[]'):(cc.comments||[])}catch(e){com=[]}
      com.push({date,time:'',text});cc.comments=JSON.stringify(com)};
    for(const t of todo){
      const rc=S.clients.find(c=>c.id===t.v.clientId)||S.clients.find(c=>norm(c.name)===norm(t.v.name)&&norm(c.city)===norm(t.v.city));
      let cc=(t.prev&&byId[t.prev.c])||(rc&&rc.crmId&&byId[rc.crmId])||list.find(c=>norm(c.salon||c.nom)===norm(t.v.name)&&(!t.v.city||norm(c.ville)===norm(t.v.city)));
      if(!cc){cc={id:'c_rx'+uidGen(),kdnr:'',sek:(rc&&rc.sector)||'',nom:t.v.name.trim(),prenom:'',salon:t.v.name.trim(),rue:'',npa:'',ville:(t.v.city||'').trim(),
        tel1:(rc&&rc.phone)||'',tel2:'',ca26:0,ca25:0,ca24:0,statut:'Actif',comments:'[]',lastVisit:'',nextVisit:'',nbVisites:0,opport:'',tasks:''};list.push(cc);byId[cc.id]=cc}
      if(rc&&rc.crmId!==cc.id){rc.crmId=cc.id;clientsChanged=true}
      const amt=num(t.v.amount);
      cc.ca26=Math.round(((Number(cc.ca26)||0)+amt-(t.prev?t.prev.a:0))*100)/100;
      if(!t.prev) cc.nbVisites=(Number(cc.nbVisites)||0)+1;
      if(!cc.lastVisit||t.date>cc.lastVisit) cc.lastVisit=t.date;
      if(cc.nextVisit&&cc.nextVisit<=t.date) cc.nextVisit='';
      t.txt=visitText(t.v);
      if(!t.prev||t.prev.t!==t.txt) comPush(cc,t.date,'[Rapport '+frDate(t.date)+(t.prev?' · modifié':'')+'] '+(t.txt||'Visite'));
      t.cc=cc;
    }
    for(const [,s] of dels){const cc=byId[s.c];if(cc){cc.ca26=Math.round(((Number(cc.ca26)||0)-(s.a||0))*100)/100;cc.nbVisites=Math.max(0,(Number(cc.nbVisites)||0)-1);
      comPush(cc,today,'[Rapport] Visite du '+frDate(s.date)+' supprimée')}}
    const w=await fetch(FB.url+'/meta/all_clients?key='+FB.key,{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(list)},count:{integerValue:String(list.length)},updated:{stringValue:new Date().toISOString()}}})});
    if(!w.ok) throw new Error('écriture du CRM ('+w.status+')');
    for(const t of todo){
      const base={clientId:t.cc.id,salon:t.cc.salon||t.cc.nom||'',nom:t.cc.nom||'',ville:t.cc.ville||'',date:t.date,comment:t.txt,commande:num(t.v.amount),opport:''};
      await fsPatch('visites/rx_'+t.v.id,{id:'rx_'+t.v.id,...base,prenom:t.cc.prenom||'',heure:t.v.time||'',objet:'Visite',priorite:'',statut:'Validée',dateVal:t.date});
      await fsPatch('historique/rx_'+t.v.id,{id:'rx_'+t.v.id,dateArchivage:t.date,...base,objet:'Visite validée'});
      sent[t.v.id]={sig:t.sig,date:t.date,a:num(t.v.amount),c:t.cc.id,t:t.txt};
    }
    for(const [id] of dels){await fsDelete('visites/rx_'+id);await fsDelete('historique/rx_'+id);delete sent[id]}
    save('crmSent',sent); if(clientsChanged) saveClients();
    crmState={at:new Date(),err:null,n:todo.length+dels.length};
  }catch(e){crmState.err=(e&&e.message)||String(e)}
  finally{crmBusy=false;showSync()}
}

async function offerFile(filename,data){
  if(downloads){try{await downloads.save({filename,data});return true}catch(e){if(e&&e.code==='declined')return false}}
  const blob=data instanceof Blob?data:new Blob([data]);
  const type=/\.pdf$/.test(filename)?'application/pdf':/\.zip$/.test(filename)?'application/zip':/\.json$/.test(filename)?'application/json':'application/octet-stream';
  let file=null; try{file=new File([blob],filename,{type})}catch(e){}
  if(file&&navigator.canShare&&navigator.share){
    let can=false; try{can=navigator.canShare({files:[file]})}catch(e){}
    if(can){
      try{await navigator.share({files:[file],title:filename});return true}
      catch(e){if(e&&e.name==='AbortError')return false; if(e&&e.name==='NotAllowedError')return shareSheet(file,blob,filename)}
    }
  }
  return plainDownload(blob,filename);
}
function plainDownload(blob,filename){
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return true}
  catch(e){toast('Téléchargement impossible ici');return false}
}
let pendingShare=null;
function shareSheet(file,blob,filename){
  return new Promise(res=>{
    pendingShare={file,blob,filename,res};
    document.getElementById('sheetHost').innerHTML='<div class="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h2>Ton fichier est prêt</h2>'+
      '<p class="hint" style="margin:0 0 14px">'+esc(filename)+'</p><div class="row" style="justify-content:flex-end">'+
      '<button class="btn" onclick="pendingDone(false)">Annuler</button><button class="btn" onclick="pendingDl()">Télécharger</button>'+
      '<button class="btn pri" id="shareNow" onclick="pendingGo()">Envoyer / Enregistrer</button></div></div></div>';
  });
}
function pendingDone(ok){const p=pendingShare;pendingShare=null;closeSheet();if(p)p.res(ok)}
function pendingGo(){const p=pendingShare;if(!p)return;navigator.share({files:[p.file],title:p.filename}).then(()=>pendingDone(true),e=>{if(e&&e.name==='AbortError')pendingDone(false);else{plainDownload(p.blob,p.filename);pendingDone(true)}})}
function pendingDl(){const p=pendingShare;if(!p)return;plainDownload(p.blob,p.filename);pendingDone(true)}

function ymLabel(ym){const [y,m]=ym.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('fr-CH',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}

async function loadMonth(ym){
  const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0);
  const mon=new Date(y,m-1,1); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const out=[];
  while(mon<=last){
    const key=iso(mon); const w=(S.week&&S.week.start===key)?S.week:await load('w'+key);
    for(let i=0;i<5;i++){const dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
      if(dt.getMonth()===m-1) out.push({date:dt,weekStart:key,day:w?w.days[i]:blankDay()})}
    mon.setDate(mon.getDate()+7);
  }
  return out;
}

function pdfTxt(s){return String(s??'').replace(/[–—]/g,'-').replace(/[’‘]/g,"'").replace(/[·•]/g,'-').replace(/[^\x00-\xFF]/g,'')}
function chfP(n){return n?pdfTxt(chf(n).replace('CHF ',''))+' CHF':''}
function pdfCtx(){

  C.facts=(y,items)=>{let x=C.M;items.forEach(([l,v])=>{doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...C.MUT);doc.text(pdfTxt(l.toUpperCase()),x,y);
    const lw=doc.getTextWidth(pdfTxt(l.toUpperCase()));doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...C.INK);doc.text(pdfTxt(v),x,y+5.5);
    const vw=doc.getTextWidth(pdfTxt(v));x+=Math.max(lw,vw)+12});};
  C.ts={theme:'plain',styles:{font:'helvetica',fontSize:8.2,cellPadding:{top:2.2,bottom:2.2,left:2,right:2},textColor:C.INK,lineColor:C.LINE,lineWidth:{bottom:.2}},

  C.doc.autoTable({...C.ts,startY:y,head:[lead.concat(['Visites','CL','P','NCL','Commandes','Montant','Km','Frais'])],body:rows,
    styles:{...C.ts.styles,fontSize:10,cellPadding:pad||3},columnStyles:{0:{fontStyle:'bold'},2:{halign:'center'},3:{halign:'center'},4:{halign:'center'},5:{halign:'center'},6:{halign:'center'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right'}},
    foot:[footLead.concat([t.n,t.cl,t.p,t.ncl,t.cmd,chfP(t.amt),t.km?t.km+' km':'',chfP(t.fr)]).map(x=>pdfTxt(String(x)))],
    footStyles:{fontStyle:'bold',fontSize:10.5,textColor:C.INK,lineWidth:{top:.6},lineColor:C.INK},
    didParseCell:c=>{if(c.section!=='body'&&c.column.index>=2)c.cell.styles.halign=c.column.index>=7?'right':'center'}});
}
function drawMonthSummary(C,ym,list){
  const {doc,M,W}=C; const t=agg(list); const weeks=byWeek(list);
  C.head('Synthèse du mois',ymLabel(ym));
  const rows=weeks.map(w=>{const a=agg(w.items);return [fmtShort(w.items[0].date)+' - '+fmtShort(w.items[w.items.length-1].date),a.days,a.n,a.cl,a.p,a.ncl,a.cmd,chfP(a.amt),a.km?a.km+' km':'',chfP(a.fr)].map(v=>pdfTxt(String(v)))});
  recapTable(C,36,['Semaine','Jours'],rows,['Total du mois',String(t.days)],t,2.4);
  let y=doc.lastAutoTable.finalY+12; C.facts(y,kpis(t)); y+=16;
  C.label('DÉPENSES DU MOIS',M,y);
  doc.autoTable({...C.ts,startY:y+2,head:[FRAIS.map(f=>pdfTxt(f[1])).concat('Total dépenses')],
    body:[FRAIS.map(([k])=>chfP(t.frk[k]||0)||'-').concat(chfP(t.fr)||'-')],styles:{...C.ts.styles,fontSize:9,halign:'right'},headStyles:{...C.ts.headStyles,halign:'right'},
    didParseCell:c=>{if(c.column.index===FRAIS.length)c.cell.styles.fontStyle='bold'}});
  y=doc.lastAutoTable.finalY+10;
  if(y>180){doc.addPage();C.head('Synthèse du mois (suite)',ymLabel(ym));y=36}
  C.label('NOUVEAUX CLIENTS ('+t.newc.length+')',M,y);
  doc.autoTable({...C.ts,startY:y+2,head:[['Date','Client','Localité','Première commande']],body:t.newc.length?t.newc.map(c=>[fmtShort(c.date),c.name,c.city||'',chfP(c.amt)||'-'].map(pdfTxt)):[['','Aucun ce mois-ci','','']],
    styles:{...C.ts.styles,fontSize:9},columnStyles:{0:{cellWidth:28},1:{fontStyle:'bold'},3:{halign:'right'}}});
}
async function makePdf(mode,el){
  if(!window.jspdf){toast('Module PDF non chargé : vérifie la connexion');return}
  if(mode==='month'&&S.view!=='mon'&&S.week) S.ym=ymOf(dateOf(S.day));
  let clipP=null;
  if(mode!=='day'){try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    clipP=navigator.clipboard.write([new ClipboardItem({'text/plain':mailText(mode).then(t=>new Blob([t],{type:'text/plain'}))})]).then(()=>true,()=>false)}}catch(e){clipP=null}}
  const btn=el||document.getElementById('pdfBtn'); const lbl=btn.textContent; btn.disabled=true; btn.textContent='Création…';
  try{
    const C=pdfCtx(); const doc=C.doc; let fname;
    const week=S.week.days.map((day,i)=>({date:dateOf(i),weekStart:S.start,day}));
    if(mode==='day'){drawDay(C,S.week.days[S.day],dateOf(S.day));fname='_'+iso(dateOf(S.day))}
    else if(mode==='week'){week.forEach((x,i)=>{if(i)doc.addPage();drawDay(C,x.day,x.date)});doc.addPage();drawWeekRecap(C,week);fname='_semaine_'+S.start}
    else{
      const list=(monthCache&&monthCache.ym===S.ym)?monthCache.list:await loadMonth(S.ym);
      drawMonthSummary(C,S.ym,list);
      list.filter(x=>hasData(x.day)).forEach(x=>{doc.addPage();drawDay(C,x.day,x.date)});
      fname='_mois_'+S.ym;
    }
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...C.MUT);doc.text(p+' / '+pages,C.W-C.M,203,{align:'right'})}
    const ok=await offerFile('Rapport_'+C.name.replace(/\s+/g,'_')+fname+'.pdf',doc.output('blob'));
    let copied=clipP?await clipP:false;
    if(!copied&&mode!=='day'){try{await navigator.clipboard.writeText(await mailText(mode));copied=true}catch(e){}}
    if(ok) toast(copied?'PDF prêt · texte du mail copié, colle-le dans ton mail':'PDF prêt');
  }catch(e){toast('Erreur PDF : '+(e&&e.message||e))}
  finally{btn.disabled=false;btn.textContent=lbl}
}
function pageNums(C){const pages=C.doc.getNumberOfPages();for(let p=1;p<=pages;p++){C.doc.setPage(p);C.doc.setFont('helvetica','normal');C.doc.setFontSize(7.5);C.doc.setTextColor(...C.MUT);C.doc.text(p+' / '+pages,C.W-C.M,203,{align:'right'})}}
async function saveDays(scope,el){
  if(!window.jspdf){toast('Module PDF non chargé : vérifie la connexion');return}
  if(!window.JSZip){toast('Module de regroupement non chargé : vérifie la connexion');return}
  const lbl=el.textContent; el.disabled=true; el.textContent='Création…';
  try{
    let list;
    if(scope==='week') list=S.week.days.map((day,i)=>({date:dateOf(i),weekStart:S.start,day}));
    else {if(S.view!=='mon'&&S.week)S.ym=ymOf(dateOf(S.day)); list=(monthCache&&monthCache.ym===S.ym)?monthCache.list:await loadMonth(S.ym)}
    list=list.filter(x=>hasData(x.day));
    if(!list.length){toast('Aucun jour rempli à enregistrer');return}
    const zip=new JSZip(); const folder=scope==='week'?'Rapports semaine '+S.start:'Rapports '+ymLabel(S.ym);
    const dir=zip.folder(folder);
    list.forEach(x=>{const C=pdfCtx();drawDay(C,x.day,x.date);pageNums(C);
      dir.file(iso(x.date)+' '+DAYN[(x.date.getDay()+6)%7]+'.pdf',C.doc.output('arraybuffer'))});
    const blob=await zip.generateAsync({type:'blob'});
    const ok=await offerFile(folder.replace(/\s+/g,'_')+'.zip',blob);
    if(ok) toast(list.length+' rapports enregistrés, un par jour');
  }catch(e){toast('Erreur : '+(e&&e.message||e))}
  finally{el.disabled=false;el.textContent=lbl}
}
async function mailText(mode){
  let txt;
  if(mode==='month'){
    const list=(monthCache&&monthCache.ym===S.ym)?monthCache.list:await loadMonth(S.ym); const t=agg(list); const L=ymLabel(S.ym).toLowerCase(); const dL=(/^[aeiouo]/.test(L)?"d'":'de ')+L;
    txt='Objet : Rapports du mois '+dL+'\n\nBonjour,\n\nVous trouverez ci-joint mes rapports du mois '+dL+' ainsi que la synthèse du mois.\n\n'+
      'En résumé : '+t.days+' jours travaillés, '+t.n+' visites, '+t.cmd+' commandes, '+chf(t.amt)+', '+t.ncl+' nouveaux clients, '+t.km+' km et '+chf(t.fr)+' de frais.\n\nMeilleures salutations\n'+S.settings.name;
  }else{
    const t=agg(S.week.days.map((day,i)=>({date:dateOf(i),weekStart:S.start,day})));
    txt='Objet : Rapports de la semaine du '+fmtShort(dateOf(0))+' au '+fmtShort(dateOf(4))+'\n\nBonjour,\n\nVous trouverez ci-joint mes rapports de la semaine du '+fmtShort(dateOf(0))+' au '+fmtShort(dateOf(4))+'.\n\n'+
      'En résumé : '+t.n+' visites, '+t.cmd+' commandes, '+chf(t.amt)+'.\n\nMeilleures salutations\n'+S.settings.name;
  }
  return txt;
}
async function copyMail(mode){const txt=await mailText(mode);
  try{await navigator.clipboard.writeText(txt);toast('Texte du mail copié')}
  catch(e){showText(txt)}
}
function showText(t){document.getElementById('sheetHost').innerHTML='<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div><h2>Texte du mail</h2><textarea id="mailTxt" style="min-height:220px">'+esc(t)+'</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn pri" onclick="closeSheet()">Fermer</button></div></div></div>';const a=document.getElementById('mailTxt');a.focus();a.select()}
boot();
</script>
