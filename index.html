function load(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch{return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function loadSch(){
const s=load(SCK)||{},m={...PRELOAD_SCHEDULE};
Object.keys(s).forEach(d=>{if(s[d]&&s[d].length)m[d]=s[d]});
return m;
}
function injectRdvIntoSchedule(){
let changed=false;
Object.entries(RDV_FIXES).forEach(([date,rdvs])=>{
const validRdvs=rdvs.filter(r=>r.kd_nr);
if(!validRdvs.length)return;
if(!sch[date])sch[date]=[];
validRdvs.sort((a,b)=>a.h.localeCompare(b.h)).forEach(rdv=>{
if(!sch[date].includes(rdv.kd_nr)){
sch[date]=[rdv.kd_nr,...sch[date].filter(id=>id!==rdv.kd_nr)];
changed=true;
} else {
const idx=sch[date].indexOf(rdv.kd_nr);
if(idx>validRdvs.indexOf(rdv)){
sch[date]=sch[date].filter(id=>id!==rdv.kd_nr);
sch[date]=[rdv.kd_nr,...sch[date]];
changed=true;
}
}
});
});
if(changed)persist();
}
function getRdvZonesForDay(date){
const rdvs=RDV_FIXES[date]||[];
const zones=new Set();
const cm_=cMap();
rdvs.forEach(r=>{
if(r.kd_nr){
const c=cm_[r.kd_nr];
if(c&&c.ort)zones.add(c.ort);
}
const lieu=(r.lieu||'').toLowerCase();
const cities=['sion','sierre','martigny','lausanne','vevey','montreux','aigle','bex','monthey','fribourg','bulle','ursy','chexbres','lutry','pully','clarens','blonay'];
cities.forEach(city=>{if(lieu.includes(city))zones.add(city.charAt(0).toUpperCase()+city.slice(1));});
});
return zones;
}

function toStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`}
function today(){return toStr(new Date())}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function wkMon(d){const x=new Date(d),dy=x.getDay();x.setDate(x.getDate()+(dy===0?-6:1-dy));x.setHours(0,0,0,0);return x}
function fmtFR(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('fr-CH',{weekday:'short',day:'2-digit',month:'2-digit'})}
function ini(n,v){return([v,n].filter(Boolean).map(p=>p[0]?.toUpperCase()).filter(Boolean).slice(0,2).join(''))||'?'}
function sal(c){return c.salon||c.name||'Salon'}
function cname(c){const n=c.vorname?`${c.vorname} ${c.name||''}`.trim():(c.name||'');return n||'Prospect'}
function getWkDates(){const mon=wkMon(new Date()),tue=addD(mon,1+wkOff*7);return Array.from({length:4},(_,i)=>toStr(addD(tue,i)))}
function allC(){const b=new Set(CR.map(c=>c.kd_nr));return[...CR,...extra.filter(c=>!b.has(c.kd_nr))]}
function activeC(){return allC().filter(c=>!del[c.kd_nr])}
function cMap(){const m={};allC().forEach(c=>{m[c.kd_nr]=c});return m}
function persist(){save(SK,vis);save(DK,del);save(SCK,sch);save(EK,extra);save(HK,hist);save(BK,book)}
function archiveCurrentVisit(kd_nr){
const v=vis[kd_nr];
if(!v||v.status!=='visited')return;
const amt=parseFloat(v.amount)||0;
if(amt<=0)return;
const already=hist.find(h=>h.kd_nr===kd_nr&&h.visitDate===v.visitDate&&Math.abs(parseFloat(h.amount)-amt)<0.01);
if(already)return;
hist.push({kd_nr,visitDate:v.visitDate,amount:v.amount,products:v.products||'',note:v.note||'',archivedAt:new Date().toISOString()});
persist();
}
function clientCA2026(kd_nr){
const fromHist=hist.filter(h=>h.kd_nr===kd_nr).reduce((s,h)=>s+(parseFloat(h.amount)||0),0);
const cur=vis[kd_nr];
if(!cur||cur.status!=='visited')return fromHist;
const curAmt=parseFloat(cur.amount)||0;
if(curAmt<=0)return fromHist;
const alreadyIn=hist.some(h=>h.kd_nr===kd_nr&&h.visitDate===cur.visitDate&&Math.abs(parseFloat(h.amount)-curAmt)<0.01);
return fromHist+(alreadyIn?0:curAmt);
}
function totalCA2026(filterFn){
const histTotal=hist
.filter(h=>!filterFn||filterFn(h.visitDate))
.reduce((s,h)=>s+(parseFloat(h.amount)||0),0);
let visExtra=0;
Object.entries(vis).forEach(([kd_nr,v])=>{
if(v.status!=='visited')return;
const amt=parseFloat(v.amount)||0;
if(amt<=0)return;
if(filterFn&&!filterFn(v.visitDate))return;
const alreadyIn=hist.some(h=>h.kd_nr===kd_nr&&h.visitDate===v.visitDate&&Math.abs(parseFloat(h.amount)-amt)<0.01);
if(!alreadyIn)visExtra+=amt;
});
return histTotal+visExtra;
}
function showToast(msg,type='ok'){
if(tTimer)clearTimeout(tTimer);
toast={msg,type};render();
tTimer=setTimeout(()=>{toast=null;render()},2600);
}
function exportSync(){
const data={vis,del,sch,extra,hist,book,at:new Date().toISOString(),v:2};
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tournee_sync_${today()}.json`;a.click();
showToast('Fichier sync exporté !');
}
function importSync(file){
const r=new FileReader();
r.onload=e=>{
try{
const d=JSON.parse(e.target.result);
if(!d.v)throw new Error('Format invalide');
vis=d.vis||{};del=d.del||{};extra=d.extra||[];book=d.book||{};
const importedHist=d.hist||[];
const existingKeys=new Set(hist.map(h=>h.kd_nr+'|'+h.visitDate+'|'+Math.round(parseFloat(h.amount)||0)));
importedHist.forEach(h=>{
const key=h.kd_nr+'|'+h.visitDate+'|'+Math.round(parseFloat(h.amount)||0);
if(!existingKeys.has(key)){hist.push(h);existingKeys.add(key);}
});
const m={...PRELOAD_SCHEDULE};
if(d.sch)Object.keys(d.sch).forEach(dt=>{if(d.sch[dt]&&d.sch[dt].length)m[dt]=d.sch[dt]});
sch=m;persist();showToast(`Sync importée - ${Object.keys(vis).length} visites, ${hist.length} commandes archivées`);render();
}catch(err){showToast('Erreur: '+err.message,'err');}
};r.readAsText(file);
}
async function exportExcel(){
showToast('Génération Excel...','warn');
const script=document.createElement('script');
script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';await new Promise((res,rej)=>{script.onload=res;script.onerror=rej;document.head.appendChild(script)});
const X=window.XLSX,wb=X.utils.book_new(),cm=cMap(),dn=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

allC().forEach(c=>{const v=vis[c.kd_nr]||{};const d=del[c.kd_nr];
const sc=Object.entries(sch).filter(([,ids])=>ids.includes(c.kd_nr)).map(([dt])=>dt).join(', ');
rows.push([c.sek,c.kd_nr,c.name,c.vorname||'',c.salon||'',c.strasse||'',c.plz||'',c.ort||'',c.tel||'',clientCA2026(c.kd_nr),parseInt(c.ca_2025)||0,parseInt(c.ca_2024)||0,parseInt(c.diff)||0,v.status||'',v.visitDate||'',v.reason||'',v.products||'',parseFloat(v.amount)||0,v.note||'',v.nextAction||'',v.followUpDate||'',sc,d?'Oui':'Non']);
});
const ws1=X.utils.aoa_to_sheet(rows);ws1['!cols']=[6,9,18,14,24,22,6,16,14,13,11,9,8,12,12,18,20,10,30,24,12,24,6].map(w=>({wch:w}));
X.utils.book_append_sheet(wb,ws1,'Clients & Visites');
const pr=[['Date','Jour','N° Client','Salon','Ville','Statut','CHF','Notes']];
Object.entries(sch).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,ids])=>{
if(!ids||!ids.length)return;const djn=dn[new Date(date+'T00:00:00').getDay()];
ids.forEach(id=>{const c=cm[id];if(!c)return;const v=vis[id]||{};
pr.push([date,djn,id,sal(c),c.ort,v.status||'planifié',parseFloat(v.amount)||0,v.note||'']);});
});
X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(pr),'Planning');
const hr=[['Date visite','N° Client','Salon','Ville','Montant CHF','Produits','Notes']];
[...hist].sort((a,b)=>(a.visitDate||'').localeCompare(b.visitDate||'')).forEach(h=>{
const c=cm[h.kd_nr];
hr.push([h.visitDate||'',h.kd_nr,c?sal(c):'?',c?c.ort:'',parseFloat(h.amount)||0,h.products||'',h.note||'']);
});
const wsH=X.utils.aoa_to_sheet(hr);wsH['!cols']=[12,9,24,16,12,24,30].map(w=>({wch:w}));
X.utils.book_append_sheet(wb,wsH,'Historique CA 2026');
X.writeFile(wb,`Tournee_${today()}.xlsx`);showToast('Excel téléchargé !');
}

function h(tag,attrs,...ch){
const el=document.createElement(tag);
if(attrs)Object.entries(attrs).forEach(([k,v])=>{
if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
else if(k.startsWith('on'))el[k.toLowerCase()]=v;
else if(k==='className')el.className=v;
else el.setAttribute(k,v);
});
ch.flat(9).forEach(c=>{if(c==null||c===false||c===undefined)return;el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});
return el;
}

function organizeAroundRdv(date,dayLabel){
const rdvs=(RDV_FIXES[date]||[]).filter(r=>r.kd_nr);
if(!rdvs.length){showToast('Aucun RDV client sur ce jour','warn');return;}
const cm_=cMap(),ac_=activeC();
const rdvCities=new Set();
rdvs.forEach(r=>{
const c=cm_[r.kd_nr];if(c&&c.ort)rdvCities.add(c.ort);
const lieu=(r.lieu||'').toLowerCase();
Object.keys(ZONE_NEIGHBORS_MAP).forEach(city=>{if(lieu.includes(city.toLowerCase()))rdvCities.add(city);});
});
const nearCities=new Set([...rdvCities]);
rdvCities.forEach(city=>{(ZONE_NEIGHBORS_MAP[city]||[]).forEach(n=>nearCities.add(n));});
const existingIds=new Set(sch[date]||[]);
const candidates=ac_
.filter(c=>{
if(existingIds.has(c.kd_nr))return false;
if(!(nearCities.has(c.ort)||rdvCities.has(c.ort)))return false;
const v=vis[c.kd_nr];
if(v&&v.status==='visited')return false;
return true;
})
.sort((a,b)=>{
const aClose=rdvCities.has(a.ort)?2:1;
const bClose=rdvCities.has(b.ort)?2:1;
if(aClose!==bClose)return bClose-aClose;
return (parseInt(b.ca_2026)||0)-(parseInt(a.ca_2026)||0);
});
const spots=MAX-(sch[date]||[]).length;
if(spots<=0){showToast('Le jour est déjà plein ('+MAX+' visites)','warn');return;}
const toAdd=candidates.slice(0,spots);
if(!toAdd.length){showToast('Pas d\'autres clients dans cette zone','warn');return;}
sch[date]=[...(sch[date]||[]),...toAdd.map(c=>c.kd_nr)];
persist();
showToast('✓ '+toAdd.length+' clients ajoutés près des RDV ('+[...new Set(toAdd.map(c=>c.ort))].slice(0,3).join(', ')+')');
render();
}

if(adjacentZones.size>0){
adjacentZones.forEach(z=>{
if(z&&z!==currentZone){
recommended.add(z);
(ZONE_NEIGHBORS[z]||[]).forEach(n=>recommended.add(n));
}
});
}
recommended.delete(currentZone);
if(recommended.size>0){
body.appendChild(h('div',{style:{fontSize:11,color:'#7c3aed',fontWeight:600,marginBottom:4}},'🎯 Zones recommandées (proches de vos RDV ou jours adjacents) :'));
[...recommended].filter(z=>ZONE_INFO[z]).forEach(zoneName=>{
const info=ZONE_INFO[zoneName];
const cm_=cMap();
const allC_=activeC();
const pool=allC_.filter(c=>info.cities.includes(c.ort));
const topCA=pool.slice(0,3).map(c=>sal(c)).join(', ');
body.appendChild(h('div',{
style:{background:'#f5f3ff',border:'1px solid '+info.color+'44',borderRadius:10,padding:'11px 14px',cursor:'pointer',marginBottom:6},
onClick:()=>loadZoneForDay(zoneName)
},
h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
h('div',null,
h('div',{style:{fontWeight:600,fontSize:13,color:info.color}},info.label),
h('div',{style:{fontSize:10,color:'#64748b',marginTop:2}},pool.length+' clients · top: '+topCA)
),
h('span',{style:{fontSize:20,color:info.color}},'+')
)
));
});
}
body.appendChild(h('div',{style:{fontSize:11,color:'#64748b',fontWeight:600,margin:'8px 0 4px'}},'📍 Toutes les zones disponibles :'));
Object.entries(ZONE_INFO).filter(([z])=>z!==currentZone).forEach(([zoneName,info])=>{
const allC_=activeC();
const pool=allC_.filter(c=>info.cities.includes(c.ort));
const isReco=recommended.has(zoneName);
body.appendChild(h('div',{
style:{background:isReco?'#f5f3ff':'#f8fafc',border:'1px solid '+(isReco?info.color+'44':'#e2e8f0'),borderRadius:9,padding:'9px 12px',cursor:'pointer',marginBottom:5,display:'flex',justifyContent:'space-between',alignItems:'center'},
onClick:()=>loadZoneForDay(zoneName)
},
h('div',null,
h('div',{style:{fontWeight:600,fontSize:12,color:info.color}},info.label),
h('div',{style:{fontSize:10,color:'#64748b'}},pool.length+' clients disponibles')
),
h('span',{style:{fontSize:16,color:'#94a3b8'}},'+')
));
});
if(PRELOAD_SCHEDULE[d]){
body.appendChild(h('button',{className:'bg',style:{width:'100%',padding:'10px',fontWeight:600,marginTop:4,borderColor:'#bbf7d0',color:'#16a34a'},
onClick:()=>{sch[d]=[...PRELOAD_SCHEDULE[d]];persist();showToast('✓ Planning initial restauré pour '+dayLabel);modal=null;render();}},'↩ Restaurer le planning initial de ce jour'));
}
sheet.appendChild(body);
}
else if(m.type==='rdv'){
const c=m.client;
const clientRdvDays=getClientRdvDays(c.kd_nr);
sheet.appendChild(h('div',{className:'sheet-h',style:{paddingTop:10}},
h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
h('div',null,
h('div',{style:{fontWeight:700,fontSize:16}},'⭐ Gérer les RDV'),
h('div',{style:{fontSize:11,color:'#d97706'}},sal(c))),
h('button',{style:{background:'#f1f5f9',border:'none',color:'#fff',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:12},
onClick:()=>{modal={type:'visit',client:c};render();}},'←'))));
const body=h('div',{className:'sheet-b'});
if(clientRdvDays.length>0){
body.appendChild(h('div',{style:{fontWeight:600,fontSize:13,color:'#d97706',marginBottom:6}},'RDV planifiés :'));
clientRdvDays.forEach(date=>{
const rdvs=(RDV_FIXES[date]||[]).filter(r=>r.kd_nr===c.kd_nr);
rdvs.forEach(rdv=>{
body.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:9,padding:'10px 12px',marginBottom:5}},
h('div',null,
h('div',{style:{fontWeight:600,fontSize:13,color:'#d97706'}},'⭐ '+rdv.h+' — '+fmtFR(date)),
h('div',{style:{fontSize:11,color:'#d97706'}},rdv.lieu)
),
h('button',{style:{background:'rgba(239,68,68,.15)',border:'1px solid #fecaca',color:'#dc2626',borderRadius:7,padding:'5px 10px',cursor:'pointer',fontSize:12},
onClick:()=>{
const rdv2=RDV_FIXES;
if(rdv2[date]){
rdv2[date]=rdv2[date].filter(r=>!(r.kd_nr===c.kd_nr&&r.h===rdv.h));
if(rdv2[date].length===0)delete rdv2[date];
}
saveRdv(rdv2);RDV_FIXES=rdv2;
showToast('RDV supprimé');modal={type:'rdv',client:c};render();
}},'🗑️ Supprimer')
));
});
});
} else {
body.appendChild(h('div',{style:{fontSize:12,color:'#64748b',marginBottom:8}},'Aucun RDV planifié pour ce client.'));
}
body.appendChild(h('div',{style:{fontWeight:600,fontSize:13,marginTop:8,marginBottom:6}},'➕ Ajouter un RDV :'));
const newDate=h('div',null,h('div',{className:'fl'},'Date'));
const dateInp=h('input',{type:'date',value:today(),className:'fi'});
newDate.appendChild(dateInp);body.appendChild(newDate);
const newHeure=h('div',null,h('div',{className:'fl'},'Heure'));
const heureInp=h('input',{type:'time',value:'09h30'.replace('h',':'),className:'fi'});
newHeure.appendChild(heureInp);body.appendChild(newHeure);
const newLieu=h('div',null,h('div',{className:'fl'},'Lieu / Objet (pré-rempli avec le salon)'));
const lieuInp=h('input',{type:'text',value:sal(c)+' — '+c.ort,className:'fi'});
newLieu.appendChild(lieuInp);body.appendChild(newLieu);
body.appendChild(h('button',{className:'bp',style:{width:'100%',padding:'11px',fontSize:13},
onClick:()=>{
const date=dateInp.value;
const heure=heureInp.value.replace(':','h');
const lieu=lieuInp.value.trim()||sal(c);
if(!date){showToast('Choisissez une date','err');return;}
const rdv2=RDV_FIXES;
if(!rdv2[date])rdv2[date]=[];
if(rdv2[date].some(r=>r.kd_nr===c.kd_nr&&r.h===heure)){showToast('RDV déjà existant pour cette date/heure','warn');return;}
rdv2[date].push({h:heure, lieu, kd_nr:c.kd_nr});
rdv2[date].sort((a,b)=>a.h.localeCompare(b.h));
saveRdv(rdv2);RDV_FIXES=rdv2;
showToast('⭐ RDV ajouté — '+heure+' le '+fmtFR(date));
modal={type:'rdv',client:c};render();
}},'⭐ Confirmer le RDV'));
body.appendChild(h('button',{className:'bg',style:{width:'100%',padding:'10px',marginTop:4},
onClick:()=>{modal={type:'visit',client:c};render();}},'← Retour à la fiche'));
sheet.appendChild(body);
}
return ov;
}
render();
}</script>
</body>
</html>
