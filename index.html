*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;overscroll-behavior:none}
input,select,textarea{font-family:inherit;font-size:16px!important;background:#fff;color:#1e293b}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.card{cursor:pointer;-webkit-user-select:none}.card:active{transform:scale(.98)}

.bg{background:#fff;border:1px solid #e2e8f0;color:#64748b;cursor:pointer;border-radius:8px;font-size:13px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}

.r-closed{box-shadow:0 0 0 3px #ef4444}.r-callback{box-shadow:0 0 0 3px #8b5cf6}.r-none{box-shadow:0 0 0 2px #e2e8f0}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:93vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.15);border-top:1px solid #e2e8f0}
.sheet-h{padding:0 18px 12px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1}
.sheet-b{padding:14px 18px 40px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.fi{width:100%;background:#f8fafc;border:1px solid #e2e8f0;color:#1e293b;padding:10px 12px;border-radius:9px;outline:none}
.day-col{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:8px 6px;display:flex;flex-direction:column;gap:3px;min-height:110px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.day-col.today{border-color:#6366f1;background:#fafaff}
.rdv-tag{font-size:9px;background:#fef3c7;color:#92400e;border-radius:4px;padding:2px 4px;font-weight:600;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{border-radius:5px;padding:4px 5px;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:10px;border:1px solid transparent;-webkit-user-select:none}
.nav-bar{display:flex;background:#fff;border-top:1px solid #e2e8f0;position:fixed;bottom:0;left:0;right:0;z-index:90;padding-bottom:env(safe-area-inset-bottom,10px);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;cursor:pointer;font-size:10px;color:#94a3b8;border:none;background:none}
.nb.on{color:#6366f1}.nb .ic{font-size:20px}
</style>

function detectZone(date_){
  const cm_=cMap();const zoneCounts={};
  (sch[date_]||[]).forEach(id=>{const c=cm_[id];if(!c)return;
    for(const[z,info]of Object.entries(ZONE_INFO)){if(info.cities.includes(c.ort)){zoneCounts[z]=(zoneCounts[z]||0)+1;break;}}
  });
  return Object.entries(zoneCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
}

function loadZoneForDay(zoneName,date_,dayLabel){
  const info=ZONE_INFO[zoneName];if(!info)return;
  const ac_=activeC().filter(c=>!(vis[c.kd_nr]?.status==='visited'));
  const pool=ac_.filter(c=>info.cities.includes(c.ort))
    .sort((a,b)=>(parseInt(b.ca_2026)||parseInt(b.ca_2025)||0)-(parseInt(a.ca_2026)||parseInt(a.ca_2025)||0));
  const rdvIds=(RDV_FIXES[date_]||[]).filter(r=>r.kd_nr).map(r=>r.kd_nr);
  const fill=pool.filter(c=>!rdvIds.includes(c.kd_nr)).slice(0,MAX-rdvIds.length);
  sch[date_]=[...rdvIds,...fill.map(c=>c.kd_nr)];
  persist();showToast('✓ Zone '+info.label+' chargée pour '+dayLabel);modal=null;render();
}

function organizeAroundRdv(date_,dayLabel){
  const rdvs=(RDV_FIXES[date_]||[]).filter(r=>r.kd_nr);
  if(!rdvs.length){showToast('Aucun RDV client ce jour','warn');return;}
  const cm_=cMap();const rdvCities=new Set();
  rdvs.forEach(r=>{const c=cm_[r.kd_nr];if(c&&c.ort)rdvCities.add(c.ort);
    const lieu=(r.lieu||'').toLowerCase();
    Object.entries(ZONE_CITY_MAP).forEach(([city])=>{if(lieu.includes(city.toLowerCase()))rdvCities.add(city);});
  });
  const rdvZones=new Set([...rdvCities].map(c=>ZONE_CITY_MAP[c]).filter(Boolean));
  const nearCities=new Set([...rdvCities]);
  rdvZones.forEach(z=>{(ZONE_INFO[z]?.cities||[]).forEach(c=>nearCities.add(c));
    (ZONE_NEIGHBORS[z]||[]).forEach(nz=>(ZONE_INFO[nz]?.cities||[]).forEach(c=>nearCities.add(c)));});
  const existingIds=new Set(sch[date_]||[]);
  const ac_=activeC().filter(c=>!existingIds.has(c.kd_nr)&&!(vis[c.kd_nr]?.status==='visited'));
  const candidates=ac_.filter(c=>nearCities.has(c.ort)).sort((a,b)=>{
    const az=rdvCities.has(a.ort)?2:1,bz=rdvCities.has(b.ort)?2:1;
    return bz-az||(parseInt(b.ca_2026)||0)-(parseInt(a.ca_2026)||0);
  });
  const spots=MAX-(sch[date_]||[]).length;
  if(spots<=0){showToast('Jour déjà plein','warn');return;}
  const toAdd=candidates.slice(0,spots);
  if(!toAdd.length){showToast('Pas de clients disponibles dans cette zone','warn');return;}
  sch[date_]=[...(sch[date_]||[]),...toAdd.map(c=>c.kd_nr)];
  persist();showToast('✓ '+toAdd.length+' clients ajoutés près des RDV');render();
}

function getClientRdvNext(kd_nr){
  const td_=today();
  const found=Object.entries(RDV_FIXES).filter(([d,rdvs])=>d>=td_&&rdvs.some(r=>r.kd_nr===kd_nr)).sort(([a],[b])=>a.localeCompare(b))[0];
  if(!found)return null;
  return{date:found[0],...found[1].find(r=>r.kd_nr===kd_nr)};
}

function toStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd}

function getWkDates(){
  const mon=new Date(),dy=mon.getDay();
  mon.setDate(mon.getDate()+(dy===0?-6:1-dy));
  mon.setHours(0,0,0,0);
  const tue=addD(toStr(mon),1+wkOff*7);
  return Array.from({length:4},(_,i)=>toStr(addD(toStr(tue),i)));
}
function allC(){const b=new Set(CR.map(c=>c.kd_nr));return[...CR,...extra.filter(c=>!b.has(c.kd_nr))]}
function activeC(){return allC().filter(c=>!del[c.kd_nr])}
function cMap(){const m={};allC().forEach(c=>{m[c.kd_nr]=c});return m}
function persist(){save(SK,vis);save(DK,del);save(SCK,sch);save(EK,extra);save(HK,hist);save(BK,book)}
function showToast(msg,type='ok'){if(tTimer)clearTimeout(tTimer);toast={msg,type};render();tTimer=setTimeout(()=>{toast=null;render()},2600);}

function totalCA2026(filter){
  let t=0;
  hist.forEach(h=>{if(!filter||filter(h.visitDate))t+=parseFloat(h.amount)||0;});
  Object.entries(vis).forEach(([kd,v])=>{
    if(v.status!=='visited'||!v.amount)return;
    const amt=parseFloat(v.amount)||0;if(amt<=0)return;
    const already=hist.some(h=>h.kd_nr===kd&&h.visitDate===v.visitDate&&Math.abs(parseFloat(h.amount)-amt)<0.01);
    if(!already&&(!filter||filter(v.visitDate)))t+=amt;
  });
  return Math.round(t);
}
function clientCA2026(kd_nr){return totalCA2026(null,kd_nr);}

function archiveCurrentVisit(kd_nr){
  const v=vis[kd_nr];if(!v||!v.status||v.status!=='visited')return;
  const amt=parseFloat(v.amount)||0;if(amt<=0)return;
  const already=hist.some(h=>h.kd_nr===kd_nr&&h.visitDate===v.visitDate&&Math.abs(parseFloat(h.amount)-amt)<0.01);
  if(!already)hist.push({kd_nr,visitDate:v.visitDate||today(),amount:amt,products:v.products||'',note:v.note||'',archivedAt:new Date().toISOString()});
  persist();
}

function exportSync(){
  const data={vis,del,sch,extra,hist,book,at:new Date().toISOString(),v:2};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tournee_sync_'+today()+'.json';a.click();
  showToast('Sync exporté !');
}
function importSync(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.v)throw new Error('Format invalide');
      vis=d.vis||{};del=d.del||{};extra=d.extra||[];hist=d.hist||[];book=d.book||{};
      const m={...PRELOAD_SCHEDULE};
      if(d.sch)Object.keys(d.sch).forEach(dt=>{if(d.sch[dt]&&d.sch[dt].length)m[dt]=d.sch[dt]});
      sch=m;persist();showToast('Sync importée !');render();
    }catch(err){showToast('Erreur: '+err.message,'err');}
  };r.readAsText(file);
}

function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el[k.toLowerCase()]=v;
    else if(k==='className')el.className=v;
    else el.setAttribute(k,v);
  });
  ch.flat(9).forEach(c=>{if(c==null||c===false||c===undefined)return;el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});
  return el;
}

    var body=h('div',{className:'sheet-b'});
    body.appendChild(h('button',{className:'bp',style:{width:'100%',padding:'13px',fontSize:14},onClick:()=>{exportSync();}},'📤 Exporter sync (.json)'));
    const impLbl=h('label',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',padding:'13px',borderRadius:10,border:'2px dashed #a5f3fc',background:'#ecfeff',color:'#0891b2',fontWeight:600,fontSize:14,cursor:'pointer'}},'📥 Importer sync (.json)',
      h('input',{type:'file',accept:'.json',style:{display:'none'},onChange:e=>{const f=e.target.files[0];if(f){importSync(f);modal=null;}}}));
    body.appendChild(impLbl);
    body.appendChild(h('div',{style:{fontSize:11,color:'#94a3b8',textAlign:'center'}},Object.keys(vis).length+' visites · '+Object.keys(sch).filter(d=>sch[d]?.length).length+' jours planifiés · CA '+totalCA2026().toLocaleString('fr-CH')+' CHF'));
    sheet.appendChild(body);

  } else if(m.type==='print'){
    sheet.appendChild(h('div',{className:'sheet-h',style:{paddingTop:10}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,h('div',{style:{fontWeight:700,fontSize:16}},'🖨️ Impression'),h('div',{style:{fontSize:11,color:'#db2777'}},'Choisissez ce que vous voulez imprimer')),
        h('button',{style:{background:'#f1f5f9',border:'none',color:'#64748b',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:12},onClick:()=>{modal=null;render();}},'✕'))));
    var body=h('div',{className:'sheet-b'});
    [{label:'📅 Planning de la semaine',fn:printPlanning},{label:'📊 Rapport CA & stats',fn:printStats},{label:'👥 Liste clients',fn:printClientList},{label:'🛍️ Produits vendus',fn:printProducts}].forEach(({label,fn})=>{
      body.appendChild(h('button',{className:'bg',style:{width:'100%',padding:'13px',fontSize:13,fontWeight:600,marginBottom:6},onClick:()=>{modal=null;render();setTimeout(fn,100);}},label));
    });
    sheet.appendChild(body);

  } else if(m.type==='addclient'){
    const {date,dayLabel}=m;
    sheet.appendChild(h('div',{className:'sheet-h',style:{paddingTop:10}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,
          h('div',{style:{fontWeight:700,fontSize:16}},'➕ Ajouter une visite'),
          h('div',{style:{fontSize:11,color:'#6366f1'}},(dayLabel||'')+' — '+fmtFR(date)+' · '+(sch[date]||[]).length+'/'+MAX)),
        h('button',{style:{background:'#f1f5f9',border:'none',color:'#64748b',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:12},onClick:()=>{modal=null;render();}},'✕'))));
    var addBody=h('div',{className:'sheet-b'});

    // Champ de recherche
    const searchW=h('div',null,h('div',{className:'fl'},'Rechercher un client existant'));
    const searchInp=h('input',{type:'search',placeholder:'Nom, salon, ville, N°…',className:'fi'});
    searchW.appendChild(searchInp);
    addBody.appendChild(searchW);

    // Résultats de recherche
    const results=h('div',{style:{display:'flex',flexDirection:'column',gap:5,maxHeight:'35vh',overflowY:'auto'}});
    addBody.appendChild(results);

    const updateSearch=()=>{
      results.innerHTML='';
      const q=searchInp.value.trim().toLowerCase();
      if(q.length<2){results.appendChild(h('div',{style:{fontSize:11,color:'#94a3b8',textAlign:'center',padding:'8px'}},'Tapez au moins 2 caractères'));return;}
      const existing=new Set(sch[date]||[]);
      const found=activeC().filter(c=>!existing.has(c.kd_nr)&&!(vis[c.kd_nr]?.status==='visited')&&
        (c.name.toLowerCase().includes(q)||c.vorname?.toLowerCase().includes(q)||
         c.salon?.toLowerCase().includes(q)||c.ort?.toLowerCase().includes(q)||c.kd_nr?.includes(q))
      ).slice(0,15);
      if(!found.length){results.appendChild(h('div',{style:{fontSize:11,color:'#94a3b8',textAlign:'center',padding:'8px'}},'Aucun client trouvé'));return;}
      found.forEach(c=>{
        const row=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc',borderRadius:9,padding:'9px 12px',border:'1px solid #f1f5f9',cursor:'pointer'},
          onClick:()=>{
            if((sch[date]||[]).length>=MAX){showToast('Maximum '+MAX+' visites ce jour !','err');return;}
            sch[date]=[c.kd_nr,...(sch[date]||[])];persist();
            showToast('✓ '+sal(c)+' ajouté');modal=null;render();
          }},
          h('div',null,
            h('div',{style:{fontWeight:600,fontSize:12}},sal(c)),
            h('div',{style:{fontSize:10,color:'#94a3b8'}},c.ort+' · SEK '+c.sek)),
          h('span',{style:{color:'#6366f1',fontSize:20,lineHeight:1}},'+'));
        results.appendChild(row);
      });
    };
    searchInp.addEventListener('input',updateSearch);
    // Afficher tous les clients disponibles dès l'ouverture
    const showAll=()=>{
      results.innerHTML='';
      const existing=new Set(sch[date]||[]);
      const found=activeC().filter(c=>!existing.has(c.kd_nr)&&!(vis[c.kd_nr]?.status==='visited')).slice(0,20);
      found.forEach(c=>{
        results.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc',borderRadius:9,padding:'9px 12px',border:'1px solid #f1f5f9',cursor:'pointer',marginBottom:4},
          onClick:()=>{
            if((sch[date]||[]).length>=MAX){showToast('Maximum '+MAX+' visites ce jour !','err');return;}
            sch[date]=[c.kd_nr,...(sch[date]||[])];persist();
            showToast('✓ '+sal(c)+' ajouté');modal=null;render();
          }},
          h('div',null,h('div',{style:{fontWeight:600,fontSize:12}},sal(c)),h('div',{style:{fontSize:10,color:'#94a3b8'}},c.ort+' · SEK '+c.sek)),
          h('span',{style:{color:'#6366f1',fontSize:20,lineHeight:1}},'+')
        ));
      });
    };
    showAll();

    // Séparateur
    addBody.appendChild(h('div',{style:{borderTop:'1px solid #f1f5f9',paddingTop:4}}));

    // Créer un prospect rapidement
    addBody.appendChild(h('div',{style:{fontWeight:600,fontSize:13,color:'#64748b'}},'Ou créer un nouveau prospect :'));
    const pForm={name:'',salon:'',ort:'',tel:''};
    const mkPF=(label,key,ph)=>{
      const w=h('div',null,h('div',{className:'fl'},label));
      const inp=h('input',{type:'text',placeholder:ph,className:'fi',onInput:e=>{pForm[key]=e.target.value;}});
      w.appendChild(inp);return w;
    };
    addBody.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
      mkPF('Nom / Salon *','salon','Coiffure Dupont'),
      mkPF('Localité','ort','Sion')));
    addBody.appendChild(mkPF('Téléphone','tel','027 XXX XX XX'));
    addBody.appendChild(h('button',{className:'bp',style:{width:'100%',padding:'11px',fontSize:13},
      onClick:()=>{
        const salon=(pForm.salon||'').trim();
        if(!salon){showToast('Nom du salon requis','err');return;}
        if((sch[date]||[]).length>=MAX){showToast('Maximum '+MAX+' visites ce jour !','err');return;}
        const kd='P'+Math.floor(10000+Math.random()*89999);
        const nouveau={kd_nr:kd,sek:'102',name:salon,vorname:'',salon,strasse:'',plz:'',ort:pForm.ort||'',tel:pForm.tel||'',ca_2025:'0',ca_2026:'0',_manual:true,_prospect:true};
        extra=[...extra,nouveau];
        sch[date]=[...(sch[date]||[]),kd];
        persist();showToast('✓ '+salon+' créé et ajouté');modal=null;render();
      }},'✓ Créer et ajouter à '+dayLabel));

    sheet.appendChild(addBody);
    sheet.appendChild(h('div',{className:'sheet-h',style:{paddingTop:10}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,h('div',{style:{fontWeight:700,fontSize:16}},'➕ Nouveau client')),
        h('button',{style:{background:'#f1f5f9',border:'none',color:'#64748b',width:28,height:28,borderRadius:7,cursor:'pointer',fontSize:12},onClick:()=>{modal=null;render();}},'✕'))));
    var body=h('div',{className:'sheet-b'});
    const form={kd_nr:'',sek:'102',name:'',vorname:'',salon:'',strasse:'',plz:'',ort:'',tel:'',ca_2025:'0'};
    const eids=new Set(allC().map(c=>c.kd_nr));
    const mkF=(label,key,type='text',ph='')=>{
      const w=h('div',null,h('div',{className:'fl'},label));
      w.appendChild(h('input',{type,value:form[key]||'',placeholder:ph,className:'fi',onInput:e=>{form[key]=e.target.value;}}));
      return w;
    };
    body.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},mkF('N° Client','kd_nr','text','P99001'),mkF('Secteur','sek','text','102')));
    body.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},mkF('Nom *','name','text','Nom'),mkF('Prénom','vorname','text','Prénom')));
    body.appendChild(mkF('Salon','salon','text','Coiffure Dupont'));
    body.appendChild(mkF('Adresse','strasse','text','Rue et numéro'));
    body.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'90px 1fr',gap:10}},mkF('NPA','plz','text','1950'),mkF('Localité','ort','text','Sion')));
    body.appendChild(mkF('Téléphone','tel','tel','027 XXX XX XX'));
    body.appendChild(h('div',{style:{display:'flex',gap:8}},
      h('button',{className:'bg',style:{flex:1,padding:'11px',fontWeight:600},onClick:()=>{modal=null;render();}},'Annuler'),
      h('button',{className:'bp',style:{flex:2,padding:'11px',fontSize:14},onClick:()=>{
        const kd=(form.kd_nr.trim()||'P'+Math.floor(10000+Math.random()*89999));
        if(!form.name.trim()){showToast('Nom requis','err');return;}
        if(eids.has(kd)){showToast('N° déjà existant','err');return;}
        extra=[...extra,{...form,kd_nr:kd,_manual:true,_prospect:!form.kd_nr.trim()}];
        persist();showToast('✓ '+(form.salon||form.name)+' ajouté');modal=null;render();
      }},'✓ Ajouter')
    ));
    sheet.appendChild(body);
  }
  return ov;
}

function printPlanning(){
  const wkDates=getWkDates(),cm=cMap();
  let html='\x3chtml><head><meta charset="UTF-8"><title>Planning</title><style>body{font-family:Arial,sans-serif;font-size:11px;margin:15mm}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.day{border:1px solid #ccc;border-radius:5px;padding:8px}.day-head{font-weight:bold;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:5px}.client{padding:3px 0;border-bottom:1px solid #f5f5f5;display:flex;justify-content:space-between}.ca{color:#16a34a;font-weight:bold}@media print{.grid{gap:4px}}</style></head><body>';
  html+='<h2 style="margin-bottom:8px">Planning — '+fmtFR(wkDates[0])+' → '+fmtFR(wkDates[3])+'</h2><div class="grid">';
  wkDates.forEach((d,i)=>{
    const ids=sch[d]||[];
    html+='<div class="day"><div class="day-head">'+WDAYS[i]+' '+fmtFR(d)+' ('+ids.length+'/'+MAX+')</div>';
    (RDV_FIXES[d]||[]).forEach(r=>{html+='<div style="font-size:9px;background:#fef3c7;padding:2px 4px;border-radius:3px;margin:2px 0">⭐ '+r.h+' '+r.lieu+'</div>';});
    ids.forEach(id=>{const c=cm[id];if(!c)return;const v=vis[id]||{},amt=parseFloat(v.amount)||0;
      html+='<div class="client"><span>'+sal(c)+'</span>'+(amt>0?'<span class="ca">'+amt.toLocaleString('fr-CH')+' CHF</span>':'')+'</div>';});
    html+='</div>';
  });
  html+='</div></body></html>';
  showPrintOverlay(html);
}

function printStats(){
  const ac=activeC(),tCA=totalCA2026(),vc=Object.values(vis).filter(v=>v.status==='visited').length;
  let html='\x3chtml><head><meta charset="UTF-8"><title>Stats</title><style>body{font-family:Arial;font-size:11px;margin:15mm}table{width:100%;border-collapse:collapse}th{background:#f5f5f5;padding:5px;text-align:left;border-bottom:1px solid #ccc}td{padding:4px 5px;border-bottom:1px solid #f0f0f0}.ca{color:#16a34a;font-weight:bold}</style></head><body>';
  html+='<h2>Rapport CA — '+new Date().toLocaleDateString('fr-CH')+'</h2>';
  html+='<p>CA total: <b>'+tCA.toLocaleString('fr-CH')+' CHF</b> · Clients visités: '+vc+'/'+ac.length+' ('+Math.round(vc/ac.length*100)+'%)</p>';
  const top=[...ac].filter(c=>totalCA2026(null)>0).sort((a,b)=>{
    const ca_a=hist.filter(h=>h.kd_nr===a.kd_nr).reduce((s,h)=>s+(parseFloat(h.amount)||0),0);
    const ca_b=hist.filter(h=>h.kd_nr===b.kd_nr).reduce((s,h)=>s+(parseFloat(h.amount)||0),0);
    return ca_b-ca_a;
  }).slice(0,20);
  html+='<table><thead><tr><th>#</th><th>Salon</th><th>Ville</th><th>CA 2026</th><th>Catalogue</th></tr></thead><tbody>';
  top.forEach((c,i)=>{const ca=hist.filter(h=>h.kd_nr===c.kd_nr).reduce((s,h)=>s+(parseFloat(h.amount)||0),0);html+='<tr><td>'+(i+1)+'</td><td>'+sal(c)+'</td><td>'+c.ort+'</td><td class="ca">'+ca.toLocaleString('fr-CH')+' CHF</td><td>'+(book[c.kd_nr]?'✅':'')+'</td></tr>';});
  html+='</tbody></table></body></html>';
  showPrintOverlay(html);
}

function printClientList(){
  const ac=activeC().sort((a,b)=>(a.ort||'').localeCompare(b.ort||''));
  let html='\x3chtml><head><meta charset="UTF-8"><title>Clients</title><style>body{font-family:Arial;font-size:9px;margin:10mm}table{width:100%;border-collapse:collapse}th{background:#f5f5f5;padding:4px;text-align:left;border-bottom:1px solid #ccc;font-size:8px}td{padding:3px 4px;border-bottom:1px solid #f5f5f5}.ca{color:#16a34a;font-weight:bold;text-align:right}</style></head><body>';
  html+='<h3 style="margin-bottom:6px">Liste clients — '+ac.length+' clients — '+new Date().toLocaleDateString('fr-CH')+'</h3>';
  html+='<table><thead><tr><th>N°</th><th>Salon</th><th>Nom</th><th>Ville</th><th>Tél</th><th>Statut</th><th>CA 2026</th><th>📖</th></tr></thead><tbody>';
  ac.forEach(c=>{const v=vis[c.kd_nr]||{},amt=parseFloat(v.amount)||0;html+='<tr><td>'+c.kd_nr+'</td><td>'+sal(c)+'</td><td>'+(c.vorname?c.vorname+' ':'')+c.name+'</td><td>'+c.ort+'</td><td>'+c.tel+'</td><td>'+(SC[v.status||'none']?.l||'')+'</td><td class="ca">'+(amt>0?amt.toLocaleString('fr-CH')+' CHF':'')+'</td><td>'+(book[c.kd_nr]?'✅':'')+'</td></tr>';});
  html+='</tbody></table></body></html>';
  showPrintOverlay(html);
}

function printProducts(){
  const entries=[];
  hist.forEach(h=>{if(h.products&&h.amount)entries.push({date:h.visitDate,salon:cMap()[h.kd_nr]?sal(cMap()[h.kd_nr]):'',ort:cMap()[h.kd_nr]?.ort||'',products:h.products,amount:parseFloat(h.amount)||0});});
  entries.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const total=entries.reduce((s,e)=>s+e.amount,0);
  let html='\x3chtml><head><meta charset="UTF-8"><title>Produits</title><style>body{font-family:Arial;font-size:10px;margin:12mm}table{width:100%;border-collapse:collapse}th{background:#f5f5f5;padding:4px;text-align:left;border-bottom:1px solid #ccc}td{padding:4px 5px;border-bottom:1px solid #f5f5f5}.ca{color:#16a34a;font-weight:bold;text-align:right}.total{font-weight:bold;border-top:2px solid #ccc}</style></head><body>';
  html+='<h3>Produits vendus — '+entries.length+' commandes — Total: '+total.toLocaleString('fr-CH')+' CHF</h3>';
  html+='<table><thead><tr><th>Date</th><th>Salon</th><th>Ville</th><th>Produits</th><th>Montant CHF</th></tr></thead><tbody>';
  entries.forEach(e=>{html+='<tr><td>'+fmtFR(e.date)+'</td><td>'+e.salon+'</td><td>'+e.ort+'</td><td>'+e.products+'</td><td class="ca">'+e.amount.toLocaleString('fr-CH')+'</td></tr>';});
  html+='<tr><td colspan="4" class="total">TOTAL</td><td class="ca total">'+total.toLocaleString('fr-CH')+' CHF</td></tr>';
  html+='</tbody></table></body></html>';
  showPrintOverlay(html);
}

function showPrintOverlay(content){
  let ov=document.getElementById('printOv');
  if(!ov){
    ov=document.createElement('div');
    ov.id='printOv';
    ov.style.cssText='position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;padding:20px';
    const closeBtn=document.createElement('button');
    closeBtn.textContent='✕ Fermer';
    closeBtn.style.cssText='position:fixed;top:16px;right:16px;background:#6366f1;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;z-index:10000;box-shadow:0 4px 12px rgba(99,102,241,.4)';
    closeBtn.onclick=()=>{ov.remove();document.body.style.overflow='';};
    const printBtn=document.createElement('button');
    printBtn.textContent='🖨️ Imprimer';
    printBtn.style.cssText='position:fixed;bottom:20px;right:16px;background:#22c55e;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;z-index:10000;box-shadow:0 4px 12px rgba(34,197,94,.4)';
    printBtn.onclick=()=>window.print();
    ov.appendChild(closeBtn);
    ov.appendChild(printBtn);
    document.body.appendChild(ov);
  }
  const content_div=document.createElement('div');
  content_div.innerHTML=content;
  // Only append body content
  const body=content_div.querySelector('body');
  const style=content_div.querySelector('style');
  if(style)document.head.appendChild(style);
  const printContent=body||content_div;
  while(ov.children.length>2)ov.removeChild(ov.lastChild);
  ov.appendChild(printContent);
  document.body.style.overflow='hidden';
}

render();
</script>
