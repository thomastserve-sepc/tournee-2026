<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#eef1f6}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#0f172a;font-size:14px;-webkit-font-smoothing:antialiased}
input,button,textarea,select{font-family:inherit;-webkit-appearance:none;font-size:16px}
button{touch-action:manipulation}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#eef1f6 0%,#e6eaf3 100%)}
.num{font-variant-numeric:tabular-nums}
/* Header */
.hdr{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:.5px solid #dde4ee;padding:0 12px;display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0;position:relative;z-index:5}
.hdr:after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:linear-gradient(90deg,#6366f1,#8b5cf6 45%,#06b6d4);opacity:.55}
.ic-btn{padding:5px 9px;border-radius:9px;border:.5px solid #e2e8f0;background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .12s}
.ic-btn:active{transform:scale(.93)}
/* Légende */
.leg{display:flex;flex-wrap:nowrap;gap:4px;padding:4px 8px;background:rgba(255,255,255,.55);border-bottom:.5px solid #e4e9f2;flex-shrink:0;overflow-x:auto}
.leg-i{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:600;padding:3px 8px;border-radius:99px;border:.5px solid;white-space:nowrap;flex-shrink:0}
.wk-nav{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.78);border-bottom:.5px solid #e4e9f2;padding:6px 12px;flex-shrink:0}
.wk-a{border:none;background:#fff;font-size:18px;cursor:pointer;color:#475569;padding:3px 11px;border-radius:9px;border:.5px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .12s}
.wk-a:active{transform:scale(.9)}
/* Grille semaine */
.week-wrap{flex:1;overflow-y:auto;padding:7px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.col{background:#fff;border-radius:14px;border:.5px solid #e4e9f2;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 18px -12px rgba(15,23,42,.28)}
.col.today{border:1.5px solid #6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.13),0 10px 22px -12px rgba(79,70,229,.5)}
.col-hdr{padding:7px 5px 6px;text-align:center;border-bottom:.5px solid #f1f5f9;flex-shrink:0}
.col-hdr.th{background:linear-gradient(135deg,#6366f1,#7c3aed)}
/* Chips */
.chip{width:100%;display:flex;align-items:center;gap:4px;padding:6px 6px;border-radius:9px;border:.5px solid;cursor:pointer;margin-bottom:3px;text-align:left;font-family:inherit;font-size:9px;transition:transform .1s}
.chip:active{transform:scale(.97)}
.s-none{background:#fff;border-color:#e5e7eb}
.s-visited{background:#dcfce7;border-color:#86efac}
.s-absent{background:#fef9c3;border-color:#fde047}
.s-closed{background:#fee2e2;border-color:#fca5a5}
.s-callback{background:#ede9fe;border-color:#c4b5fd}
.s-patron{background:#fce7f3;border-color:#f9a8d4}
.s-sel{background:#eef2ff!important;border:1.5px solid #6366f1!important;box-shadow:0 0 0 3px rgba(99,102,241,.14)}
.rdv-pill{font-size:8px;font-weight:600;padding:3px 5px;border-radius:5px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;margin:2px 3px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
/* Boutons bas colonne */
.col-bot{padding:4px;border-top:.5px solid #f1f5f9;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.add-btn{width:100%;padding:6px;font-size:9px;font-weight:700;color:#4f46e5;background:#eef2ff;border:.5px dashed #c7d2fe;border-radius:8px;cursor:pointer;font-family:inherit}
.add-btn:active{transform:scale(.97)}
.mini-row{display:flex;gap:3px}
.mini-btn{flex:1;padding:4px;font-size:8px;font-weight:700;border-radius:7px;cursor:pointer;font-family:inherit}
/* Nav */

.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:#94a3b8;font-family:inherit;position:relative}
.nb.on{color:#4f46e5}
.nb.on:before{content:'';position:absolute;top:2px;width:30px;height:3px;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:flex-end;justify-content:center}

.sh-h{padding:14px 18px;border-bottom:.5px solid #f1f5f9;position:sticky;top:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:3;display:flex;justify-content:space-between;align-items:center}
.sh-b{padding:14px 18px 46px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.fi{width:100%;background:#f8fafc;border:.5px solid #e2e8f0;color:#0f172a;padding:11px 13px;border-radius:10px;font-size:16px;font-family:inherit}
.fi:focus{outline:none;border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.btn-p{background:linear-gradient(135deg,#6366f1,#7c3aed);border:none;color:#fff;padding:14px;border-radius:13px;font-weight:700;font-size:14px;cursor:pointer;width:100%;font-family:inherit;box-shadow:0 6px 16px -6px rgba(99,102,241,.75);transition:transform .12s}

.btn-g{background:#f0fdf4;border:.5px solid #86efac;color:#15803d;padding:12px;border-radius:13px;font-weight:700;font-size:13px;cursor:pointer;width:100%;font-family:inherit}
.btn-y{background:#fffbeb;border:.5px solid #fde68a;color:#d97706;padding:12px;border-radius:13px;font-weight:700;font-size:13px;cursor:pointer;width:100%;font-family:inherit}
.btn-r{background:#fef2f2;border:.5px solid #fecaca;color:#dc2626;padding:12px;border-radius:13px;font-weight:700;font-size:13px;cursor:pointer;width:100%;font-family:inherit}

/* Onglets fiche */
.seg{display:flex;gap:3px;background:#eef1f7;border:.5px solid #e2e8f0;border-radius:13px;padding:3px}
.seg-b{flex:1;padding:9px 6px;border:none;background:transparent;border-radius:10px;font-size:12px;font-weight:700;color:#64748b;cursor:pointer;font-family:inherit;position:relative}
.seg-b.on{background:#fff;color:#4f46e5;box-shadow:0 1px 4px rgba(15,23,42,.14)}
.seg-d{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:99px;background:#22c55e}
/* Catalogue */
.cat-r{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:11px;border:.5px solid #e2e8f0;background:#fff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;width:100%;text-align:left;color:#0f172a;transition:transform .1s}

.cat-r.on{border-color:#86efac;background:#f0fdf4;color:#15803d;font-weight:700}
.cat-x{width:23px;height:23px;border-radius:8px;border:1.5px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;background:#fff}
.cat-r.on .cat-x{background:#22c55e;border-color:#22c55e;color:#fff}
.card{background:#fff;border:.5px solid #e4e9f2;border-radius:13px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;z-index:9999;white-space:nowrap;box-shadow:0 8px 26px rgba(15,23,42,.32)}
</style>

  var sc=app.querySelector('.week-wrap')?app.querySelector('.week-wrap').scrollTop:0;
  app.innerHTML='';
  var wk=getWk(),cm=cMap(),td=tod();
  var tCA=totalCA(),wCA=totalCA(function(d){return wk.includes(d)}),dCA=totalCA(function(d){return d===td});
  var vc=Object.values(vis).filter(function(v){return v.status==='visited'}).length;
  var wkLbl=wkOff===0?'Semaine en cours':wkOff===-1?'Sem. précédente':'Sem. '+(wkOff>0?'+':'')+wkOff;

  // Toast
  if(toast){var tb=document.createElement('div');tb.className='toast';tb.style.background=toast.type==='err'?'#ef4444':toast.type==='warn'?'#f59e0b':'#22c55e';tb.textContent=toast.msg;app.appendChild(tb)}

  // Modal
  if(modal)app.appendChild(renderModal(modal,wk,cm,td));

  // HEADER
  var hdr=document.createElement('div');hdr.className='hdr';
  var hl=document.createElement('div');hl.style.cssText='display:flex;align-items:center;gap:9px';
  var hi=document.createElement('div');hi.style.cssText='width:30px;height:30px;background:linear-gradient(135deg,#6366f1,#7c3aed);box-shadow:0 3px 9px -2px rgba(99,102,241,.6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px';hi.textContent='✂️';
  var ht=document.createElement('div');
  ht.innerHTML='<div style="font-weight:700;font-size:14px;letter-spacing:-.2px">Tournée 2026</div><div class="num" style="font-size:10px;color:#94a3b8">'+actC().length+' clients · '+vc+' visités · '+dCA.toLocaleString('fr-CH')+' CHF</div>';
  hl.appendChild(hi);hl.appendChild(ht);
  var hr2=document.createElement('div');hr2.style.cssText='display:flex;gap:5px';
  [['🔄',function(){modal={type:'sync'};render()}],['🖨️',function(){modal={type:'print'};render()}]].forEach(function(b){
    var btn=document.createElement('button');btn.textContent=b[0];btn.className='ic-btn';btn.onclick=b[1];hr2.appendChild(btn);
  });
  hdr.appendChild(hl);hdr.appendChild(hr2);app.appendChild(hdr);

  // LÉGENDE
  var leg=document.createElement('div');leg.className='leg';
  Object.keys(SC).filter(function(k){return k!=='none'}).forEach(function(k){
    var s=SC[k];var li=document.createElement('div');li.className='leg-i';
    li.style.cssText='background:'+s.bg+';border-color:'+s.bc+';color:'+s.c;li.textContent=s.i+' '+s.l;leg.appendChild(li);
  });
  app.appendChild(leg);

  // NAV SEMAINE
  var wkn=document.createElement('div');wkn.className='wk-nav';
  var tot=wk.reduce(function(s,d){return s+(sch[d]||[]).length},0);
  var prev=document.createElement('button');prev.className='wk-a';prev.textContent='‹';prev.onclick=function(){wkOff--;render()};
  var next=document.createElement('button');next.className='wk-a';next.textContent='›';next.onclick=function(){wkOff++;render()};
  var mid=document.createElement('div');mid.style.cssText='text-align:center';
  mid.innerHTML='<div style="font-weight:700;font-size:13px;letter-spacing:-.2px">'+wkLbl+'</div><div class="num" style="font-size:10px;color:#94a3b8">'+fmt(wk[0])+' → '+fmt(wk[3])+' · '+tot+' clients · '+wCA.toLocaleString('fr-CH')+' CHF</div>';
  wkn.appendChild(prev);wkn.appendChild(mid);wkn.appendChild(next);app.appendChild(wkn);

  // CONTENU
  if(view==='week'){
    var wrap=document.createElement('div');wrap.className='week-wrap';
    var grid=document.createElement('div');grid.className='grid';
    wk.forEach(function(d,i){grid.appendChild(renderCol(d,i,cm,td))});
    wrap.appendChild(grid);app.appendChild(wrap);
    setTimeout(function(){var w=app.querySelector('.week-wrap');if(w)w.scrollTop=sc},0);
  } else if(view==='list'){
    var lw=document.createElement('div');lw.style.cssText='flex:1;overflow-y:auto;padding:8px';
    lw.appendChild(renderList(cm));app.appendChild(lw);
  } else if(view==='stats'){
    var sw=document.createElement('div');sw.style.cssText='flex:1;overflow-y:auto;padding:8px';
    sw.appendChild(renderStats(wk,td,tCA,wCA,dCA));app.appendChild(sw);
  }

  // NAV
  var nav=document.createElement('nav');nav.className='nav';
  var nRest=actC().filter(function(c){return!(vis[c.kd_nr]&&vis[c.kd_nr].status==='visited')}).length;
  [{v:'week',i:'📅',l:'Planning'},{v:'list',i:'👥',l:'Clients',b:nRest},{v:'stats',i:'📊',l:'Stats'},{v:'new',i:'➕',l:'Nouveau'}].forEach(function(n){
    var b=document.createElement('button');b.className='nb'+(view===n.v?' on':'');
    b.innerHTML='<span style="font-size:20px;position:relative;display:inline-block">'+n.i+(n.b?'<span class="num" style="position:absolute;top:-3px;right:-13px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;line-height:1.5">'+n.b+'</span>':'')+'</span>'+n.l;
    b.onclick=n.v==='new'?function(){modal={type:'newclient'};render()}:function(){view=n.v;render()};
    nav.appendChild(b);
  });
  app.appendChild(nav);
}

function renderCol(d,i,cm,td){
  var ids=sch[d]||[];
  var cnt=ids.length,isT=d===td,isPast=d<td;
  var dCA=totalCA(function(x){return x===d});
  var vc=ids.filter(function(id){return vis[id]&&vis[id].status==='visited'}).length;
  var barPct=Math.min(Math.round(cnt/MAX*100),100);
  var barCol=cnt>=MAX?'#22c55e':cnt>=10?'#f59e0b':'#6366f1';
  var rdvs=(rdv[d]||[]);

  var col=document.createElement('div');
  col.className='col'+(isT?' today':'');
  col.style.opacity=isPast?.8:1;

  // Header colonne
  var ch=document.createElement('div');
  ch.className='col-hdr'+(isT?' th':'');
  ch.innerHTML='<div style="font-weight:700;font-size:13px;color:'+(isT?'#fff':'#374151')+'">'+WDAYS[i]+'</div>'
    +'<div style="font-size:10px;color:'+(isT?'rgba(255,255,255,.8)':'#94a3b8')+'">'+fmt(d)+'</div>'
    +'<div style="font-size:12px;font-weight:700;color:'+(isT?'#fff':barCol)+';margin-top:1px">'+cnt+'/'+MAX+(cnt>=MAX?' ✓':'')+(vc>0?' · '+vc+' ✅':'')+'</div>'
    +'<div style="background:'+(isT?'rgba(255,255,255,.3)':'#e2e8f0')+';border-radius:99px;height:3px;overflow:hidden;margin:3px 2px">'
      +'<div style="width:'+barPct+'%;height:100%;background:'+(isT?'#fff':barCol)+';border-radius:99px"></div></div>'
    +(dCA>0?'<div style="font-size:11px;font-weight:700;color:'+(isT?'rgba(255,255,255,.95)':'#16a34a')+'">'+dCA.toLocaleString('fr-CH')+' CHF</div>':'');

  // RDV fixes dans l'en-tête
  rdvs.forEach(function(r){
    var rt=document.createElement('div');rt.className='rdv-pill';
    rt.textContent='⭐ '+(r.heure||r.h||'')+(r.heure||r.h?' ':'')+(r.salon||r.lieu||'').split('—')[0].trim().slice(0,18);
    ch.appendChild(rt);
  });
  col.appendChild(ch);

  // Clients
  var cl=document.createElement('div');cl.style.cssText='padding:3px';
  ids.forEach(function(id){
    var c=cm[id]||{kd_nr:id,name:id,salon:id,ort:''};
    var v=vis[id]||{},st=v.status||'none',cfg=SC[st]||SC.none;
    var amt=parseFloat(v.amount)||0,hb=!!book[id];
    var isSel=sel===id&&selD===d;

    var chip=document.createElement('button');
    chip.className='chip '+(isSel?'s-sel':cfg.bg==='#fff'?'s-none':'s-'+st);
    var ico=document.createElement('span');ico.style.cssText='font-size:10px;flex-shrink:0;font-weight:700;color:'+cfg.c;ico.textContent=cfg.i;chip.appendChild(ico);
    var inf=document.createElement('div');inf.style.cssText='flex:1;min-width:0';
    var nm=document.createElement('div');nm.style.cssText='font-size:9px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b';
    nm.textContent=(st==='visited'?'✅ ':'')+sal(c)+(hb?' 📖':'');
    var sb=document.createElement('div');sb.style.cssText='font-size:8px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    sb.textContent=c.ort+(amt>0?' · '+amt.toLocaleString('fr-CH'):'');
    inf.appendChild(nm);inf.appendChild(sb);chip.appendChild(inf);
    var x=document.createElement('span');x.style.cssText='color:#cbd5e1;font-size:11px;flex-shrink:0;padding:0 1px';x.textContent='×';
    x.onclick=function(e){e.stopPropagation();sch[d]=(sch[d]||[]).filter(function(id2){return id2!==id});persist();if(sel===id)sel=null;render()};
    chip.appendChild(x);

    // 1 tap = sélection | 2 taps = fiche
    chip.onclick=function(e){
      e.stopPropagation();var now=Date.now(),key=id+'_'+d;
      if(ltk===key&&(now-ltt)<400){sel=null;selD=null;ltk=null;modal={type:'visit',kd:id,fromDay:d};render()}
      else{ltk=key;ltt=now;sel=sel===id&&selD===d?null:id;selD=sel?d:null;render()}
    };
    cl.appendChild(chip);

    // Boutons ↑↓ si sélectionné
    if(isSel){
      var mv=document.createElement('div');mv.style.cssText='display:flex;gap:2px;margin-bottom:3px';
      var idx=ids.indexOf(id),tot2=ids.length;
      ['↑','↓','✕'].forEach(function(t){
        var b=document.createElement('button');b.textContent=t;
        b.style.cssText='flex:1;padding:6px;font-size:13px;font-weight:700;border:none;border-radius:5px;font-family:inherit;cursor:pointer;background:'+(t==='✕'?'#f1f5f9':'#6366f1')+';color:'+(t==='✕'?'#64748b':'#fff');
        if(t==='↑')b.onclick=function(){if(idx<=0)return;var a=[].concat(ids);a.splice(idx,1);a.splice(idx-1,0,id);sch[d]=a;persist();render()};
        else if(t==='↓')b.onclick=function(){if(idx>=tot2-1)return;var a=[].concat(ids);a.splice(idx,1);a.splice(idx+1,0,id);sch[d]=a;persist();render()};
        else b.onclick=function(){sel=null;selD=null;render()};
        mv.appendChild(b);
      });
      cl.appendChild(mv);
    }
  });
  if(!ids.length){var emp=document.createElement('div');emp.style.cssText='text-align:center;color:#cbd5e1;font-size:9px;padding:8px 0';emp.textContent='— vide —';cl.appendChild(emp)}
  col.appendChild(cl);

  // Boutons bas
  var bot=document.createElement('div');bot.className='col-bot';
  var ab=document.createElement('button');ab.className='add-btn';ab.textContent='+ Ajouter';ab.onclick=function(){modal={type:'add',date:d,day:WDAYS[i]};render()};bot.appendChild(ab);
  var mr=document.createElement('div');mr.className='mini-row';
  [['↺ Zone','#6366f1','#eff6ff','#c7d2fe',function(){modal={type:'zone',date:d,day:WDAYS[i]};render()}],
   ['⭐ RDV','#d97706','#fffbeb','#fde68a',function(){modal={type:'rdv',date:d,day:WDAYS[i]};render()}],
   ['🗺️','#0891b2','#ecfeff','#a5f3fc',function(){optimizeRoute(d)}]
  ].forEach(function(b){
    var btn=document.createElement('button');btn.className='mini-btn';btn.textContent=b[0];
    btn.style.cssText='flex:1;padding:3px;font-size:8px;font-weight:600;color:'+b[1]+';background:'+b[2]+';border:.5px solid '+b[3]+';border-radius:4px;cursor:pointer;font-family:inherit';
    btn.onclick=b[4];mr.appendChild(btn);
  });
  bot.appendChild(mr);col.appendChild(bot);
  return col;
}

function renderList(cm){
  var wrap=document.createElement('div');
  var ac=actC();
  var isV=function(c){return vis[c.kd_nr]&&vis[c.kd_nr].status==='visited'};
  var nV=ac.filter(isV).length,nR=ac.length-nV;
  var pct=ac.length?Math.round(nV/ac.length*100):0;

  // Bandeau progression
  var pb=document.createElement('div');pb.className='card';pb.style.marginBottom='8px';
  pb.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'
    +'<div style="font-weight:700;font-size:14px">Couverture du portefeuille</div>'
    +'<div class="num" style="font-weight:800;font-size:15px;color:'+(pct>=100?'#16a34a':pct>=50?'#6366f1':'#94a3b8')+'">'+pct+'%</div></div>'
    +'<div style="background:#e8edf5;border-radius:99px;height:8px;overflow:hidden"><div style="width:'+pct+'%;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#16a34a)"></div></div>'
    +'<div class="num" style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:#64748b">'
    +'<span style="color:#15803d;font-weight:700">\u2713 '+nV+' visit\u00e9s</span>'
    +'<span style="color:#475569;font-weight:700">\u25cb '+nR+' \u00e0 visiter</span>'
    +'<span>sur '+ac.length+' clients</span></div>';
  wrap.appendChild(pb);

  // Filtres
  var seg=document.createElement('div');seg.className='seg';seg.style.marginBottom='8px';
  [['all','Tous ('+ac.length+')'],['todo','\u25cb \u00c0 visiter ('+nR+')'],['done','\u2713 Visit\u00e9s ('+nV+')']].forEach(function(f){
    var b=document.createElement('button');b.className='seg-b'+(listF===f[0]?' on':'');b.textContent=f[1];
    b.onclick=function(){listF=f[0];render()};seg.appendChild(b);
  });
  wrap.appendChild(seg);

  var si=document.createElement('input');si.type='search';si.placeholder='\ud83d\udd0d Rechercher\u2026';si.className='fi';
  si.style.cssText+=';background:#fff;margin-bottom:8px;display:block';
  si.value=listQ||'';
  wrap.appendChild(si);
  var res=document.createElement('div');wrap.appendChild(res);

  function upd(){
    res.innerHTML='';
    var q=si.value.toLowerCase();listQ=si.value;
    var list=ac.filter(function(c){
      if(listF==='done'&&!isV(c))return false;
      if(listF==='todo'&&isV(c))return false;
      return!q||sal(c).toLowerCase().includes(q)||c.ort&&c.ort.toLowerCase().includes(q)||c.kd_nr.includes(q);
    }).sort(function(a,b){return(a.ort||'').localeCompare(b.ort||'')||sal(a).localeCompare(sal(b))});

    if(!list.length){
      var em=document.createElement('div');em.style.cssText='text-align:center;padding:34px 16px;color:#94a3b8;font-size:13px';
      em.textContent=listF==='todo'?'\ud83c\udf89 Tous les clients ont \u00e9t\u00e9 visit\u00e9s !':'Aucun client trouv\u00e9';
      res.appendChild(em);return;
    }

    var cnt=document.createElement('div');cnt.className='num';cnt.style.cssText='font-size:11px;color:#94a3b8;margin:2px 4px 6px;font-weight:600';
    cnt.textContent=list.length+' client'+(list.length>1?'s':'')+(q?' trouv\u00e9'+(list.length>1?'s':''):'');
    res.appendChild(cnt);

    var lastCity=null;
    list.forEach(function(c){
      if(c.ort!==lastCity){
        lastCity=c.ort;
        var gh=document.createElement('div');gh.style.cssText='font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin:10px 4px 5px';
        gh.textContent=c.ort||'\u2014';res.appendChild(gh);
      }
      var v=vis[c.kd_nr]||{},st=v.status||'none',cfg=SC[st]||SC.none,amt=parseFloat(v.amount)||0,hb=!!book[c.kd_nr],done=st==='visited';
      var row=document.createElement('div');
      row.style.cssText='width:100%;display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 11px;margin-bottom:5px;box-sizing:border-box;border:.5px solid '
        +(done?'#86efac':'#e8edf5')+';background:'+(done?'linear-gradient(135deg,#f0fdf4,#dcfce7)':'#fff')
        +';box-shadow:0 1px 2px rgba(15,23,42,.04)';

      // Case de validation verte
      var ck=document.createElement('button');
      ck.style.cssText='width:32px;height:32px;border-radius:10px;flex-shrink:0;cursor:pointer;font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:transform .12s;'
        +(done?'background:#22c55e;border:1.5px solid #22c55e;color:#fff':'background:#fff;border:1.5px solid #cbd5e1;color:#cbd5e1');
      ck.textContent=done?'\u2713':'\u25cb';
      ck.onclick=function(ev){
        if(ev&&ev.stopPropagation)ev.stopPropagation();
        if(done){vis[c.kd_nr]=Object.assign({},v,{status:'none'});showToast('Visite annul\u00e9e','warn')}
        else{vis[c.kd_nr]=Object.assign({},v,{status:'visited',visitDate:v.visitDate||tod()});showToast('\u2713 '+sal(c)+' visit\u00e9')}
        persist();archVis(c.kd_nr);render();
      };
      row.appendChild(ck);

      var inf=document.createElement('button');
      inf.style.cssText='flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;font-family:inherit;cursor:pointer';
      var nm=document.createElement('div');
      nm.style.cssText='font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:'+(done?'#15803d':'#0f172a');
      nm.textContent=sal(c)+(hb?' \ud83d\udcd6':'');
      var sb=document.createElement('div');sb.className='num';sb.style.cssText='font-size:11px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      sb.textContent=(c.tel||'')+(c.ca_2025&&parseInt(c.ca_2025)?' \u00b7 CA25 '+parseInt(c.ca_2025).toLocaleString('fr-CH'):'');
      inf.appendChild(nm);inf.appendChild(sb);
      inf.onclick=function(){modal={type:'visit',kd:c.kd_nr};render()};
      row.appendChild(inf);

      var ri=document.createElement('div');ri.style.cssText='text-align:right;flex-shrink:0';
      if(st!=='none'&&st!=='visited'){
        var bdg=document.createElement('div');bdg.style.cssText='font-size:10px;padding:3px 9px;border-radius:99px;background:'+cfg.bg+';color:'+cfg.c+';font-weight:700;border:.5px solid '+cfg.bc;
        bdg.textContent=cfg.i+' '+cfg.l;ri.appendChild(bdg);
      }
      if(amt>0){var am=document.createElement('div');am.className='num';am.style.cssText='font-size:11px;color:#16a34a;font-weight:700;margin-top:3px';am.textContent=amt.toLocaleString('fr-CH')+' CHF';ri.appendChild(am)}
      if(done&&v.visitDate){var dt=document.createElement('div');dt.className='num';dt.style.cssText='font-size:10px;color:#15803d;margin-top:2px';dt.textContent=fmtL(v.visitDate);ri.appendChild(dt)}
      row.appendChild(ri);
      res.appendChild(row);
    });
  }
  si.oninput=upd;upd();return wrap;
}

function renderStats(wk,td,tCA,wCA,dCA){
  var wrap=document.createElement('div');
  var vc=Object.values(vis).filter(function(v){return v.status==='visited'}).length;
  var OBJ=38000,mois=td.slice(0,7),caM=totalCA(function(d){return d&&d.slice(0,7)===mois}),pct=Math.round(caM/OBJ*100);
  var g=document.createElement('div');g.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px';
  [{l:"CA auj.",v:dCA,c:'#16a34a'},{l:'CA sem.',v:wCA,c:'#6366f1'},{l:'CA mois',v:caM,c:pct>=100?'#16a34a':pct>=75?'#d97706':'#dc2626'},{l:'CA total',v:tCA,c:'#7c3aed'}].forEach(function(k){
    var card=document.createElement('div');card.style.cssText='background:#fff;border-radius:10px;padding:12px;border:.5px solid #f1f5f9;border-left:3px solid '+k.c;
    card.innerHTML='<div style="font-size:18px;font-weight:700;color:'+k.c+'">'+k.v.toLocaleString('fr-CH')+' CHF</div><div style="font-size:11px;color:#64748b;margin-top:3px">'+k.l+'</div>';
    g.appendChild(card);
  });
  wrap.appendChild(g);
  var obj=document.createElement('div');obj.style.cssText='background:#fff;border-radius:10px;padding:12px;border:.5px solid #f1f5f9;margin-bottom:8px';
  obj.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:7px"><div style="font-weight:600;font-size:13px">Objectif — 38 000 CHF</div><div style="font-weight:700;font-size:16px;color:'+(pct>=100?'#16a34a':pct>=75?'#d97706':'#6366f1')+'">'+pct+'%</div></div>'
    +'<div style="background:#e2e8f0;border-radius:99px;height:6px;overflow:hidden"><div style="width:'+Math.min(pct,100)+'%;height:100%;background:'+(pct>=100?'#16a34a':pct>=75?'#d97706':'#6366f1')+';border-radius:99px"></div></div>';
  wrap.appendChild(obj);
  var sg=document.createElement('div');sg.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:6px';
  [{l:'Visités',v:vc,c:'#16a34a'},{l:'Absents',v:Object.values(vis).filter(function(v){return v.status==='absent'}).length,c:'#d97706'},{l:'Rappels',v:Object.values(vis).filter(function(v){return v.status==='callback'}).length,c:'#7c3aed'},{l:'Catalogues',v:Object.keys(book).length,c:'#0891b2'}].forEach(function(s){
    var sc=document.createElement('div');sc.style.cssText='background:#fff;border-radius:10px;padding:10px;text-align:center;border:.5px solid #f1f5f9';
    sc.innerHTML='<div style="font-size:20px;font-weight:700;color:'+s.c+'">'+s.v+'</div><div style="font-size:9px;color:#94a3b8;margin-top:2px">'+s.l+'</div>';
    sg.appendChild(sc);
  });
  wrap.appendChild(sg);return wrap;
}

function renderModal(m,wk,cm,td){
  var ov=document.createElement('div');ov.className='ov';
  ov.onclick=function(e){if(e.target===ov){modal=null;render()}};
  var sh=document.createElement('div');sh.className='sh';
  var hdl=document.createElement('div');hdl.style.cssText='width:36px;height:4px;background:#e2e8f0;border-radius:2px;margin:10px auto 0';sh.appendChild(hdl);
  ov.appendChild(sh);

  function mkH(title,sub){

      if(nRdv.kd_nr&&!(sch[m.date]||[]).includes(nRdv.kd_nr)){
        sch[m.date]=[nRdv.kd_nr].concat(sch[m.date]||[]);
      }
      persist();showToast('✓ RDV ajouté!');modal=null;render();
    };
    rdvForm.appendChild(addBtn);
    addSection.appendChild(rdvForm);bd2.appendChild(addSection);
    sh.appendChild(bd2);

  // ── AJOUT CLIENT ──────────────────────────────────────────────────────────
  } else if(m.type==='add'){
    sh.appendChild(mkH('➕ Ajouter',m.day+' · '+(sch[m.date]||[]).length+'/'+MAX));
    var ab2=document.createElement('div');ab2.className='sh-b';
    var si2=document.createElement('input');si2.type='search';si2.className='fi';si2.placeholder='Nom, salon, ville…';si2.style.marginBottom='8px';ab2.appendChild(si2);
    var res2=document.createElement('div');res2.style.cssText='max-height:50vh;overflow-y:auto';ab2.appendChild(res2);
    var showC=function(){
      res2.innerHTML='';var q=si2.value.toLowerCase(),ex=new Set(sch[m.date]||[]);
      var isV2=function(c){return vis[c.kd_nr]&&vis[c.kd_nr].status==='visited'};
      var base=actC().filter(function(c){return!ex.has(c.kd_nr)&&(!q||sal(c).toLowerCase().includes(q)||c.ort&&c.ort.toLowerCase().includes(q)||c.kd_nr.includes(q))});
      var hid=base.filter(isV2).length;
      var pool2=addShowV?base:base.filter(function(c){return!isV2(c)});
      if(hid){
        var hb2=document.createElement('button');
        hb2.style.cssText='width:100%;padding:8px;margin-bottom:7px;border-radius:9px;border:.5px dashed #cbd5e1;background:#f8fafc;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit';
        hb2.textContent=addShowV?('\u2713 '+hid+' d\u00e9j\u00e0 visit\u00e9(s) affich\u00e9(s) \u2014 masquer'):('\u2713 '+hid+' d\u00e9j\u00e0 visit\u00e9(s) masqu\u00e9(s) \u2014 afficher');
        hb2.onclick=function(){addShowV=!addShowV;showC()};
        res2.appendChild(hb2);
      }
      if(!pool2.length){var e2=document.createElement('div');e2.style.cssText='text-align:center;padding:22px;color:#94a3b8;font-size:12px';e2.textContent=q?'Aucun r\u00e9sultat':'Tous les clients de la liste ont \u00e9t\u00e9 visit\u00e9s';res2.appendChild(e2)}
      pool2.slice(0,20).forEach(function(c){
        var b=document.createElement('button');b.style.cssText='width:100%;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:9px;padding:10px 12px;border:.5px solid #f1f5f9;cursor:pointer;margin-bottom:4px;font-family:inherit;text-align:left;box-sizing:border-box';
        var vd2=isV2(c);
        if(vd2)b.style.cssText+=';background:#f0fdf4;border-color:#bbf7d0';
        var l=document.createElement('div');l.innerHTML='<div style="font-size:12px;font-weight:600;color:'+(vd2?'#15803d':'#1e293b')+'">'+(vd2?'\u2713 ':'')+sal(c)+'</div><div style="font-size:10px;color:#64748b">'+c.ort+' · SEK '+c.sek+'</div>';
        var p=document.createElement('span');p.style.cssText='color:#6366f1;font-size:20px';p.textContent='+';
        b.appendChild(l);b.appendChild(p);
        b.onclick=function(){if((sch[m.date]||[]).length>=MAX){showToast('Maximum '+MAX+'!','err');return}sch[m.date]=[c.kd_nr].concat(sch[m.date]||[]);persist();showToast('✓ '+sal(c)+' ajouté');modal=null;render()};
        res2.appendChild(b);
      });
    };
    si2.oninput=showC;showC();sh.appendChild(ab2);

  // ── ZONE ─────────────────────────────────────────────────────────────────
  } else if(m.type==='zone'){
    sh.appendChild(mkH('↺ Zone',m.day||''));
    var zb=document.createElement('div');zb.className='sh-b';
    Object.keys(ZONE_INFO).forEach(function(z){
      var b=document.createElement('button');b.className='btn-s';b.style.marginBottom='4px';
      b.textContent=ZONE_INFO[z].label+' — '+ZONE_INFO[z].cities.slice(0,3).join(', ')+'…';
      b.onclick=function(){loadZone(m.date,z)};zb.appendChild(b);
    });
    sh.appendChild(zb);

  // ── SYNC ─────────────────────────────────────────────────────────────────
  } else if(m.type==='sync'){
    sh.appendChild(mkH('🔄 Synchronisation'));
    var sb2=document.createElement('div');sb2.className='sh-b';
    var eb=document.createElement('button');eb.className='btn-p';eb.textContent='📤 Exporter sync (.json)';eb.onclick=exportSync;sb2.appendChild(eb);
    var il=document.createElement('label');il.style.cssText='display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:10px;border:1.5px dashed #94a3b8;background:#f8fafc;color:#64748b;font-weight:600;font-size:14px;cursor:pointer';il.textContent='📥 Importer sync (.json)';
    var fi=document.createElement('input');fi.type='file';fi.accept='.json';fi.style.display='none';fi.onchange=function(e){var f=e.target.files[0];if(f){importSync(f);modal=null}};il.appendChild(fi);sb2.appendChild(il);
    sb2.appendChild((function(){var d=document.createElement('div');d.style.cssText='font-size:11px;color:#94a3b8;text-align:center';d.textContent=Object.keys(vis).length+' visites · CA '+totalCA().toLocaleString('fr-CH')+' CHF';return d})());
    sh.appendChild(sb2);

  // ── IMPRESSION ────────────────────────────────────────────────────────────
  } else if(m.type==='print'){
    sh.appendChild(mkH('🖨️ Imprimer'));
    var pb=document.createElement('div');pb.className='sh-b';
    [{l:'📅 Planning semaine',fn:printWeek},{l:'👥 Liste clients',fn:printClients},{l:'📊 Rapport CA',fn:printCA}].forEach(function(item){
      var b=document.createElement('button');b.className='btn-s';b.style.marginBottom='4px';b.textContent=item.l;b.onclick=function(){modal=null;render();setTimeout(item.fn,100)};pb.appendChild(b);
    });
    sh.appendChild(pb);

  // ── NOUVEAU CLIENT ────────────────────────────────────────────────────────
  } else if(m.type==='newclient'){
    sh.appendChild(mkH('➕ Nouveau client'));
    var nb2=document.createElement('div');nb2.className='sh-b';var nf={salon:'',ort:'',tel:'',npa:''};
    function mkNF(lbl2,key2,ph){var w=document.createElement('div');w.innerHTML='<div class="lbl">'+lbl2+'</div>';var inp=document.createElement('input');inp.type='text';inp.className='fi';inp.placeholder=ph;inp.oninput=function(){nf[key2]=inp.value};w.appendChild(inp);return w}
    nb2.appendChild(mkNF('Nom du salon *','salon','Coiffure Dupont'));
    var tw3=document.createElement('div');tw3.style.cssText='display:grid;grid-template-columns:90px 1fr;gap:8px';tw3.appendChild(mkNF('NPA','npa','1950'));tw3.appendChild(mkNF('Localité','ort','Sion'));nb2.appendChild(tw3);
    nb2.appendChild(mkNF('Téléphone','tel','027 XXX XX XX'));
    var nsb=document.createElement('button');nsb.className='btn-p';nsb.textContent='✓ Ajouter';nsb.onclick=function(){if(!nf.salon.trim()){showToast('Nom requis','err');return}extra.push({kd_nr:'P'+Math.floor(10000+Math.random()*89999),sek:'102',name:nf.salon,salon:nf.salon,vorname:'',strasse:'',plz:nf.npa||'',ort:nf.ort||'',tel:nf.tel||'',ca_2025:'0',ca_2026:'0'});persist();showToast('✓ '+nf.salon+' ajouté!');modal=null;render()};
    nb2.appendChild(nsb);sh.appendChild(nb2);
  }

  return ov;
}

// Impression
function showPrintOv(title,content){
  var old=document.getElementById('pov');if(old){old.remove();document.body.style.overflow=''}
  var ov2=document.createElement('div');ov2.id='pov';ov2.style.cssText='position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;font-family:-apple-system,sans-serif';
  var bar=document.createElement('div');bar.style.cssText='position:sticky;top:0;background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:10';
  var bk=document.createElement('button');bk.textContent='← Retour';bk.style.cssText='padding:8px 14px;background:#374151;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600';bk.onclick=function(){ov2.remove();document.body.style.overflow=''};
  var tt2=document.createElement('span');tt2.textContent=title;tt2.style.cssText='color:#fff;font-weight:700;font-size:14px;flex:1';
  var pr=document.createElement('button');pr.textContent='🖨️ Imprimer';pr.style.cssText='padding:8px 16px;background:#6366f1;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700';pr.onclick=function(){window.print()};
  bar.appendChild(bk);bar.appendChild(tt2);bar.appendChild(pr);ov2.appendChild(bar);
  var cd=document.createElement('div');cd.style.cssText='padding:20px;max-width:900px;margin:0 auto';cd.innerHTML=content;ov2.appendChild(cd);
  document.body.appendChild(ov2);document.body.style.overflow='hidden';
}
function printWeek(){var wk=getWk(),cm=cMap(),wCA2=totalCA(function(d){return wk.includes(d)});var html='<h2 style="margin-bottom:4px">Planning '+fmt(wk[0])+' → '+fmt(wk[3])+'</h2><p style="color:#64748b;margin-bottom:16px">CA: <b style="color:#16a34a">'+wCA2.toLocaleString('fr-CH')+' CHF</b></p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">';wk.forEach(function(d,i){var ids=sch[d]||[],dc=totalCA(function(x){return x===d});html+='<div style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden"><div style="background:#6366f1;color:#fff;padding:7px;font-size:11px;font-weight:700">'+WDAYS_S[i]+' '+fmt(d)+'<br><span style="opacity:.8;font-size:9px">'+ids.length+'/14'+(dc>0?' · '+dc.toLocaleString('fr-CH')+' CHF':'')+(rdv[d]&&rdv[d].length?' · ⭐ RDV':'')+'</span></div>';(rdv[d]||[]).forEach(function(r){html+='<div style="padding:4px 6px;background:#fef9c3;font-size:9px;border-bottom:1px solid #f1f5f9">⭐ '+r.heure+' '+r.salon+'</div>'});ids.forEach(function(id){var c=cm[id];if(!c)return;var v=vis[id]||{},a=parseFloat(v.amount)||0,st=v.status||'',ico={visited:'✓',absent:'~',closed:'✕',callback:'↩',patron:'👤'}[st]||'○',bg={visited:'#dcfce7',absent:'#fef9c3',closed:'#fee2e2',patron:'#fce7f3'}[st]||'#fff';html+='<div style="padding:4px 6px;border-bottom:1px solid #f1f5f9;font-size:9px;background:'+bg+'"><b>'+ico+' '+sal(c)+(book[id]?' 📖':'')+'</b>'+(a>0?' <span style="float:right;color:#16a34a">'+a.toLocaleString('fr-CH')+'</span>':'')+'</div>'});if(!ids.length)html+='<div style="padding:8px;text-align:center;color:#94a3b8;font-size:9px">— vide —</div>';html+='</div>'});html+='</div>';showPrintOv('Planning',html)}
function printClients(){var ac=actC().sort(function(a,b){return(a.ort||'').localeCompare(b.ort||'')});var html='<h2 style="margin-bottom:16px">Clients ('+ac.length+')</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:#6366f1;color:#fff"><th style="padding:6px">Salon</th><th>Ville</th><th>Tél</th><th>Statut</th><th>CHF</th><th>📖</th></tr>';ac.forEach(function(c,i){var v=vis[c.kd_nr]||{},a=parseFloat(v.amount)||0,st=v.status||'',ico={visited:'✓',absent:'~',closed:'✕',callback:'↩',patron:'👤'}[st]||'○';html+='<tr style="background:'+(i%2?'#f8fafc':'#fff')+'"><td style="padding:5px 6px;font-weight:600">'+sal(c)+'</td><td style="padding:5px 6px">'+c.ort+'</td><td style="padding:5px 6px">'+c.tel+'</td><td style="padding:5px 6px">'+ico+'</td><td style="padding:5px 6px;text-align:right;color:#16a34a;font-weight:600">'+(a>0?a.toLocaleString('fr-CH'):'')+'</td><td style="padding:5px 6px;text-align:center">'+(book[c.kd_nr]?'📖':'')+'</td></tr>'});html+='</table>';showPrintOv('Clients',html)}
function printCA(){var cmds=Object.entries(vis).filter(function(e){return e[1].status==='visited'&&parseFloat(e[1].amount)>0}).sort(function(a,b){return(b[1].visitDate||'').localeCompare(a[1].visitDate||'')});var cm2=cMap(),tot2=0;var html='<h2 style="margin-bottom:16px">Rapport CA</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:#16a34a;color:#fff"><th style="padding:6px">Date</th><th>Salon</th><th>Ville</th><th>Produits</th><th>CHF</th></tr>';cmds.forEach(function(e,i){var c2=cm2[e[0]],v2=e[1],a2=parseFloat(v2.amount)||0;tot2+=a2;html+='<tr style="background:'+(i%2?'#f0fdf4':'#fff')+'"><td style="padding:5px 6px">'+fmtL(v2.visitDate)+'</td><td style="padding:5px 6px;font-weight:600">'+(c2?sal(c2):e[0])+'</td><td style="padding:5px 6px">'+(c2?c2.ort:'')+'</td><td style="padding:5px 6px">'+(v2.products||'')+'</td><td style="padding:5px 6px;text-align:right;font-weight:600;color:#16a34a">'+a2.toLocaleString('fr-CH')+'</td></tr>'});html+='<tr style="font-weight:700;border-top:2px solid #e2e8f0"><td colspan="4" style="padding:8px">TOTAL</td><td style="padding:8px;text-align:right;color:#16a34a;font-size:14px">'+tot2.toLocaleString('fr-CH')+' CHF</td></tr></table>';showPrintOv('CA',html)}

try{render()}catch(err){document.getElementById('app').innerHTML='<div style="padding:20px;color:#dc2626;font-family:sans-serif"><h3>Erreur: '+err.message+'</h3><pre style="font-size:11px">'+err.stack+'</pre></div>'}
</script>
