<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Inter',sans-serif;background:#0a0f1e;color:#f1f5f9;min-height:100vh;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
input,select,textarea{font-family:inherit;font-size:16px!important;color-scheme:dark}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.card{transition:transform .12s;cursor:pointer;-webkit-user-select:none}
.card:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;cursor:pointer;border-radius:10px;font-weight:600;transition:.15s;font-size:14px}
.bg{background:transparent;border:1px solid #334155;color:#94a3b8;cursor:pointer;border-radius:8px;transition:.15s;font-size:13px}
.bg:active{background:rgba(99,102,241,.15);border-color:#6366f1;color:#a5b4fc}
.bd{background:transparent;border:1px solid #ef444433;color:#f87171;cursor:pointer;border-radius:7px;font-size:12px;padding:4px 9px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.r-visited{box-shadow:0 0 0 3px #22c55e}.r-absent{box-shadow:0 0 0 3px #f59e0b}
.r-closed{box-shadow:0 0 0 3px #ef4444}.r-callback{box-shadow:0 0 0 3px #8b5cf6}.r-none{box-shadow:0 0 0 2px #334155}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:#0f172a;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:93vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.6);border-top:1px solid #1e293b}
.sheet-h{padding:0 18px 12px;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#0f172a;z-index:1}
.sheet-b{padding:14px 18px 40px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:10px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.fi{width:100%;background:#060d1a;border:1px solid #1e293b;color:#f1f5f9;padding:10px 12px;border-radius:9px;outline:none}
.day-col{background:#0f172a;border-radius:10px;border:1px solid #1e293b;padding:8px 6px;display:flex;flex-direction:column;gap:3px;min-height:110px}
.day-col.today{border-color:#6366f140;background:rgba(99,102,241,.06)}
.rdv-tag{font-size:9px;background:rgba(245,158,11,.15);color:#f59e0b;border-radius:4px;padding:2px 4px;font-weight:600;margin:1px 0;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{border-radius:5px;padding:4px 5px;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:10px;border:1px solid transparent;-webkit-user-select:none}
.cc:active{opacity:.7}
.nav-bar{display:flex;background:#0f172a;border-top:1px solid #1e293b;position:fixed;bottom:0;left:0;right:0;z-index:90;padding-bottom:env(safe-area-inset-bottom,10px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;cursor:pointer;font-size:10px;color:#64748b;border:none;background:none}
.nb.on{color:#6366f1}
.nb .ic{font-size:20px}
</style>

// Archive la visite en cours dans l'historique (pour cumul CA réel toutes visites confondues)
// Appelé quand on quitte la fiche d'un client après avoir saisi une visite "visited" avec un montant
function archiveCurrentVisit(kd_nr){
  const v=vis[kd_nr];
  if(!v||v.status!=='visited')return;
  const amt=parseFloat(v.amount)||0;
  if(amt<=0)return; // pas de commande, rien à archiver
  // Vérifie si cette visite (même date+montant) n'est pas déjà archivée pour éviter doublons
  const already=hist.find(h=>h.kd_nr===kd_nr&&h.visitDate===v.visitDate&&parseFloat(h.amount)===amt);
  if(already)return;
  hist.push({kd_nr,visitDate:v.visitDate,amount:v.amount,products:v.products||'',note:v.note||'',archivedAt:new Date().toISOString()});
  persist();
}
// CA 2026 réel d'un client = somme de tout son historique + commande en cours si déjà 'visited'
function clientCA2026(kd_nr){
  const fromHist=hist.filter(h=>h.kd_nr===kd_nr).reduce((s,h)=>s+(parseFloat(h.amount)||0),0);
  const cur=vis[kd_nr];
  const curAmt=(cur&&cur.status==='visited')?(parseFloat(cur.amount)||0):0;
  // Évite double-comptage si la visite courante a déjà été archivée à l'identique
  const curAlreadyArchived=cur&&hist.find(h=>h.kd_nr===kd_nr&&h.visitDate===cur.visitDate&&parseFloat(h.amount)===curAmt);
  return fromHist+(curAlreadyArchived?0:curAmt);
}
// CA 2026 total (tous clients) = historique + visites en cours non encore archivées
function totalCA2026(filterFn){
  let total=hist.filter(h=>!filterFn||filterFn(h.visitDate)).reduce((s,h)=>s+(parseFloat(h.amount)||0),0);
  Object.entries(vis).forEach(([kd_nr,v])=>{
    if(v.status!=='visited')return;
    const amt=parseFloat(v.amount)||0;
    if(amt<=0)return;
    if(filterFn&&!filterFn(v.visitDate))return;
    const alreadyArchived=hist.find(h=>h.kd_nr===kd_nr&&h.visitDate===v.visitDate&&parseFloat(h.amount)===amt);
    if(!alreadyArchived)total+=amt;
  });
  return total;
}

function importSync(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.v)throw new Error('Format invalide');
      vis=d.vis||{};del=d.del||{};extra=d.extra||[];
      // Fusionne l'historique (pas de remplacement, pour ne jamais perdre de commandes archivées)
      const importedHist=d.hist||[];
      const existingKeys=new Set(hist.map(h=>h.kd_nr+'|'+h.visitDate+'|'+h.amount));
      importedHist.forEach(h=>{
        const key=h.kd_nr+'|'+h.visitDate+'|'+h.amount;
        if(!existingKeys.has(key)){hist.push(h);existingKeys.add(key);}
      });
      const m={...PRELOAD_SCHEDULE};
      if(d.sch)Object.keys(d.sch).forEach(dt=>{if(d.sch[dt]&&d.sch[dt].length)m[dt]=d.sch[dt]});
      sch=m;persist();showToast(`Sync importée - ${Object.keys(vis).length} visites, ${hist.length} commandes archivées`);render();
    }catch(err){showToast('Erreur: '+err.message,'err');}
  };r.readAsText(file);
}

function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el[k.toLowerCase()]=v;
    else if(k==='className')el.className=v;
    else el.setAttribute(k,v);
  });
  ch.flat(9).forEach(c=>{if(c==null||c===false||c===undefined)return;el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});
  return el;
}

    body.appendChild(h('div',{style:{background:'rgba(99,102,241,.08)',border:'1px solid #6366f130',borderRadius:9,padding:'9px 12px',fontSize:11,color:'#a5b4fc'}},
      '💡 Pour un prospect, le numéro client n\u2019est pas obligatoire — il sera généré automatiquement. Seul le nom ou le salon est requis.'));
    body.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},mkF('N° Client (optionnel)','kd_nr','text','laisser vide si prospect'),mkF('Secteur','sek','text','102 ou 112')));
    body.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},mkF('Nom','name','text','Nom'),mkF('Prénom','vorname','text','Prénom')));
    body.appendChild(mkF('Salon','salon','text','ex: Coiffure Dupont'));
    body.appendChild(mkF('Adresse','strasse','text','Rue et numéro'));
    body.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'90px 1fr',gap:10}},mkF('NPA','plz','text','1950'),mkF('Localité','ort','text','Sion')));
    body.appendChild(mkF('Téléphone','tel','tel','027 XXX XX XX'));
    body.appendChild(mkF('Réf. CA 2025 (CHF)','ca_2025','number','0'));
    body.appendChild(h('div',{style:{display:'flex',gap:8}},
      h('button',{className:'bg',style:{flex:1,padding:'11px',fontWeight:600},onClick:()=>{modal=null;render();}},'Annuler'),
      h('button',{className:'bp',style:{flex:2,padding:'11px',fontSize:14},onClick:()=>{
        if(!form.name.trim()&&!form.salon.trim()){showToast('Indiquez au moins un nom ou un salon','err');return;}
        let kd=form.kd_nr.trim();
        if(kd&&eids.has(kd)){showToast('Numéro déjà existant','err');return;}
        if(!kd){
          // Génère un numéro temporaire unique pour les prospects sans N° client
          do{kd='P'+Math.floor(10000+Math.random()*89999);}while(eids.has(kd));
        }
        extra=[...extra,{...form,kd_nr:kd,_manual:true,_prospect:!form.kd_nr.trim()}];
        persist();showToast('\u2713 '+(form.salon||form.name)+' ajouté'+(form.kd_nr.trim()?'':' (prospect, N° '+kd+')'));modal=null;render();
      }},'✓ Ajouter')
    ));
    sheet.appendChild(body);

  } else if(m.type==='addday'){
    const d=m.date,dayLabel=m.dayLabel;
    sheet.appendChild(h('div',{className:'sheet-h',style:{paddingTop:10}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,h('div',{style:{fontWeight:700,fontSize:16}},'➕ Visite imprévue'),
          h('div',{style:{fontSize:11,color:'#6366f1'}},dayLabel+' '+fmtFR(d))),
        h('button',{style:{background:'rgba(255,255,255,.1)',border:'none',color:'#fff',width:26,height:26,borderRadius:7,cursor:'pointer',fontSize:12},onClick:()=>{modal=null;render();}},'✕'))));
    const body=h('div',{className:'sheet-b'});

    const dayCount=(sch[d]||[]).length;
    if(dayCount>=MAX){
      body.appendChild(h('div',{style:{background:'rgba(239,68,68,.12)',border:'1px solid #ef444444',borderRadius:9,padding:'10px 12px',fontSize:12,color:'#f87171',fontWeight:600}},
        '⚠️ Ce jour est déjà à '+dayCount+'/'+MAX+' visites — il faut d\u2019abord en retirer une.'));
    }

    body.appendChild(h('div',{style:{fontSize:12,color:'#94a3b8'}},'Recherchez un client à ajouter à cette journée (même hors planning initial) :'));

    const searchWrap=h('div',null);
    const searchInp=h('input',{type:'search',placeholder:'\uD83D\uDD0D  Nom, salon, ville…',value:'',
      style:{width:'100%',background:'#060d1a',border:'1px solid #1e293b',color:'#f1f5f9',padding:'10px 12px',borderRadius:9,outline:'none'},
    });
    searchWrap.appendChild(searchInp);
    body.appendChild(searchWrap);

    const resultsEl=h('div',{style:{display:'flex',flexDirection:'column',gap:5,maxHeight:'45vh',overflowY:'auto',marginTop:6}});
    body.appendChild(resultsEl);

    let q='';
    function buildAddResults(){
      const all_=activeC();
      const already=new Set(sch[d]||[]);
      let list=all_;
      if(q){
        const ql=q.toLowerCase();
        list=list.filter(c=>(c.name||'').toLowerCase().includes(ql)||c.vorname?.toLowerCase().includes(ql)||c.salon?.toLowerCase().includes(ql)||c.ort?.toLowerCase().includes(ql)||c.kd_nr?.includes(ql));
        list=list.slice(0,30);
      } else {
        list=[]; // show nothing until search to avoid huge list
      }
      return {list,already};
    }

    function renderAddResults(){
      const {list,already}=buildAddResults();
      resultsEl.innerHTML='';
      if(!q){
        resultsEl.appendChild(h('div',{style:{textAlign:'center',color:'#334155',fontSize:12,padding:'16px 0'}},'Tapez un nom pour rechercher…'));
        return;
      }
      if(list.length===0){
        resultsEl.appendChild(h('div',{style:{textAlign:'center',color:'#334155',fontSize:12,padding:'10px 0'}},'Aucun client trouvé'));
        return;
      }
      list.forEach(c=>{
        const isAlready=already.has(c.kd_nr);
        const v=vis[c.kd_nr];
        resultsEl.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:9,background:isAlready?'rgba(34,197,94,.07)':'#0f172a',border:'1px solid '+(isAlready?'#22c55e44':'#1e293b'),borderRadius:9,padding:'9px 11px',cursor:isAlready?'default':'pointer',opacity:isAlready?.7:1},
          onClick:()=>{
            if(isAlready)return;
            if((sch[d]||[]).length>=MAX){showToast('Maximum '+MAX+' visites ce jour !','err');return;}
            sch[d]=[...(sch[d]||[]),c.kd_nr];persist();
            showToast('✓ '+sal(c)+' ajouté à '+dayLabel);
            modal=null;render();
          }},
          h('div',{style:{width:32,height:32,borderRadius:8,background:'linear-gradient(135deg,#4f46e5,#7c3aed)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff',flexShrink:0}},ini(c.name,c.vorname)),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontWeight:600,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},sal(c)),
            h('div',{style:{fontSize:10,color:'#64748b'}},cname(c),' · ',c.ort)),
          isAlready?h('span',{style:{fontSize:9,color:'#22c55e',fontWeight:700,flexShrink:0}},'✓ DÉJÀ'):h('span',{style:{fontSize:14,color:'#6366f1',flexShrink:0}},'+')
        ));
      });
    }
    searchInp.oninput=e=>{q=e.target.value;renderAddResults();};
    renderAddResults();

    // Séparateur + bouton pour créer un nouveau prospect directement et l'ajouter à ce jour
    body.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:8,margin:'4px 0'}},
      h('div',{style:{flex:1,height:1,background:'#1e293b'}}),h('span',{style:{fontSize:10,color:'#475569'}},'OU'),h('div',{style:{flex:1,height:1,background:'#1e293b'}})));

    const prospectToggle=h('button',{className:'bg',style:{width:'100%',padding:'11px',fontWeight:600,fontSize:13,borderColor:'#22c55e44',color:'#4ade80'}},
      '➕ Créer un nouveau prospect pour ce jour');
    body.appendChild(prospectToggle);

    const prospectForm=h('div',{style:{display:'none',flexDirection:'column',gap:10,marginTop:8,background:'#060d1a',border:'1px solid #1e293b',borderRadius:10,padding:'12px'}});
    body.appendChild(prospectForm);

    prospectToggle.onclick=()=>{
      const isOpen=prospectForm.style.display==='flex';
      prospectForm.style.display=isOpen?'none':'flex';
      prospectToggle.textContent=isOpen?'➕ Créer un nouveau prospect pour ce jour':'✕ Annuler la création';
    };

    const pf={name:'',salon:'',ort:'',tel:''};
    const mkPF=(label,key,ph)=>{
      const w=h('div',null,h('div',{className:'fl'},label));
      const inp=h('input',{type:'text',value:pf[key],placeholder:ph,className:'fi',oninput:e=>{pf[key]=e.target.value;}});
      w.appendChild(inp);return w;
    };
    prospectForm.appendChild(h('div',{style:{fontSize:11,color:'#4ade80',fontWeight:600}},'📋 Nouveau prospect — nom ou salon requis'));
    prospectForm.appendChild(mkPF('Nom du salon','salon','ex: Coiffure Dupont'));
    prospectForm.appendChild(mkPF('Nom du contact','name','Nom (optionnel si salon rempli)'));
    prospectForm.appendChild(mkPF('Ville','ort','ex: Sion'));
    prospectForm.appendChild(mkPF('Téléphone','tel','027 XXX XX XX (optionnel)'));
    prospectForm.appendChild(h('button',{className:'bp',style:{padding:'11px',fontSize:13,marginTop:2},
      onClick:()=>{
        if(!pf.name.trim()&&!pf.salon.trim()){showToast('Indiquez au moins un nom ou un salon','err');return;}
        if((sch[d]||[]).length>=MAX){showToast('Maximum '+MAX+' visites ce jour !','err');return;}
        const eids=new Set(allC().map(c=>c.kd_nr));
        let kd;do{kd='P'+Math.floor(10000+Math.random()*89999);}while(eids.has(kd));
        const newClient={kd_nr:kd,sek:'102',name:pf.name.trim(),vorname:'',salon:pf.salon.trim(),strasse:'',plz:'',ort:pf.ort.trim(),tel:pf.tel.trim(),ca_2025:'0',_manual:true,_prospect:true};
        extra=[...extra,newClient];
        sch[d]=[...(sch[d]||[]),kd];
        persist();
        showToast('✓ '+(pf.salon||pf.name)+' créé et ajouté à '+dayLabel);
        modal=null;render();
      }},'✓ Créer et ajouter à '+dayLabel));

    sheet.appendChild(body);
  }
  return ov;
}

render();
</script>
</body>
</html>
