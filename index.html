  });

}

}

  var pool=actC().filter(function(c){return info.cities.includes(c.ort)&&!rdvIds.includes(c.kd_nr)&&!(vis[c.kd_nr]&&vis[c.kd_nr].status==='visited')}).sort(function(a,b){return(parseInt(b.ca_2025)||0)-(parseInt(a.ca_2025)||0)});

function optimizeRoute(date_){
  var ids=[].concat(sch[date_]||[]);if(ids.length<=2){showToast('Pas assez de clients','warn');return;}
  var cm=cMap();
  var rdvIds=getRdv(date_).filter(function(r){return r.kd_nr}).map(function(r){return r.kd_nr});
  var fixed=rdvIds.filter(function(id){return ids.includes(id)});
  var free=ids.filter(function(id){return!fixed.includes(id)});
  var last=fixed.length>0?(cm[fixed[fixed.length-1]]||{}).ort||'Lausanne':'Lausanne';
  var rem=[].concat(free),ord=[];
  while(rem.length){var bi=0,bd=999;rem.forEach(function(id,i){var d=cdist(last,(cm[id]||{}).ort||'');if(d<bd){bd=d;bi=i}});var nx=rem.splice(bi,1)[0];ord.push(nx);last=(cm[nx]||{}).ort||last}
  sch[date_]=fixed.concat(ord);persist();showToast('✓ Route optimisée !');render();
}

    var res2=h('div',{style:{maxHeight:'50vh',overflowY:'auto'}});ab2.appendChild(res2);
    var showC=function(){
      res2.innerHTML='';var q=si2.value.toLowerCase(),ex=new Set(sch[date]||[]);
      actC().filter(function(c){return!ex.has(c.kd_nr)&&(!q||sal(c).toLowerCase().includes(q)||c.ort&&c.ort.toLowerCase().includes(q)||c.kd_nr.includes(q))}).slice(0,20).forEach(function(c){
        var b=document.createElement('button');b.style.cssText='width:100%;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:9px;padding:10px 12px;border:1px solid #f1f5f9;cursor:pointer;margin-bottom:4px;font-family:inherit;text-align:left;box-sizing:border-box';
        var l=document.createElement('div');l.innerHTML='<div style="font-size:12px;font-weight:600;color:#1e293b">'+sal(c)+'</div><div style="font-size:10px;color:#64748b">'+c.ort+' · SEK '+c.sek+'</div>';
        var p=document.createElement('span');p.textContent='+';p.style.cssText='color:#6366f1;font-size:22px;font-weight:300';
        b.appendChild(l);b.appendChild(p);
        b.onclick=function(){if((sch[date]||[]).length>=MAX){showToast('Maximum '+MAX+'!','err');return}sch[date]=[c.kd_nr].concat(sch[date]||[]);persist();showToast('✓ '+sal(c)+' ajouté');modal=null;render()};
        res2.appendChild(b);
      });
    };
    si2.oninput=showC;showC();sh.appendChild(ab2);

  } else if(m.type==='zone'){
    sh.appendChild(mkH('↺ Zone',m.day||''));
    var zb2=h('div',{cls:'sh-b'});
    Object.keys(ZONE_INFO).forEach(function(z){
      var b=document.createElement('button');b.className='bs';b.style.cssText='width:100%;padding:13px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-weight:600;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:6px';b.textContent=ZONE_INFO[z].label+' — '+ZONE_INFO[z].cities.slice(0,3).join(', ')+'…';b.onclick=function(){loadZone(m.date,z)};
      zb2.appendChild(b);
    });
    sh.appendChild(zb2);

  } else if(m.type==='print'){
    sh.appendChild(mkH('🖨️ Imprimer'));
    var pb2=h('div',{cls:'sh-b'});
    [{l:'📅 Planning de la semaine',fn:printWeek},{l:'👥 Liste clients',fn:printClients},{l:'📊 Rapport CA',fn:printCA}].forEach(function(item){
      var b=document.createElement('button');b.className='bs';b.style.cssText='width:100%;padding:13px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-weight:600;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:6px;display:block';b.textContent=item.l;b.onclick=function(){modal=null;render();setTimeout(item.fn,100)};
      pb2.appendChild(b);
    });
    sh.appendChild(pb2);

  } else if(m.type==='newclient'){
    sh.appendChild(mkH('➕ Nouveau client / prospect'));
    var nb2=h('div',{cls:'sh-b'});var nf={salon:'',ort:'',tel:'',npa:''};
    function mkNF(lbl2,key2,ph){var w=h('div',{});w.appendChild(h('div',{cls:'lbl'},lbl2));var inp=document.createElement('input');inp.type='text';inp.className='fi';inp.placeholder=ph;inp.oninput=function(){nf[key2]=inp.value};w.appendChild(inp);return w}
    nb2.appendChild(mkNF('Nom du salon *','salon','Coiffure Dupont'));
    nb2.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'90px 1fr',gap:'8px'}},[mkNF('NPA','npa','1950'),mkNF('Localité','ort','Sion')]));
    nb2.appendChild(mkNF('Téléphone','tel','027 XXX XX XX'));
    var nsb=document.createElement('button');nsb.className='bp';nsb.textContent='✓ Ajouter le client';nsb.onclick=function(){if(!nf.salon.trim()){showToast('Nom requis','err');return}extra.push({kd_nr:'P'+Math.floor(10000+Math.random()*89999),sek:'102',name:nf.salon,salon:nf.salon,vorname:'',strasse:'',plz:nf.npa||'',ort:nf.ort||'',tel:nf.tel||'',ca_2025:'0',ca_2026:'0'});persist();showToast('✓ '+nf.salon+' ajouté!');modal=null;render()};
    nb2.appendChild(nsb);sh.appendChild(nb2);
  }
  return ov;
}

function showPrintOv(title,content){
  var old=document.getElementById('pov');if(old){old.remove();document.body.style.overflow=''}
  var ov=document.createElement('div');ov.id='pov';ov.style.cssText='position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;font-family:-apple-system,sans-serif';
  var bar=document.createElement('div');bar.style.cssText='position:sticky;top:0;background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:10';
  var bk=document.createElement('button');bk.textContent='← Retour';bk.style.cssText='padding:8px 14px;background:#374151;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600';bk.onclick=function(){ov.remove();document.body.style.overflow=''};
  var tt=document.createElement('span');tt.textContent=title;tt.style.cssText='color:#fff;font-weight:700;font-size:14px;flex:1';
  var pr=document.createElement('button');pr.textContent='🖨️ Imprimer';pr.style.cssText='padding:8px 16px;background:#6366f1;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700';pr.onclick=function(){window.print()};
  bar.appendChild(bk);bar.appendChild(tt);bar.appendChild(pr);ov.appendChild(bar);
  var cd=document.createElement('div');cd.style.cssText='padding:20px;max-width:900px;margin:0 auto';cd.innerHTML=content;ov.appendChild(cd);
  document.body.appendChild(ov);document.body.style.overflow='hidden';
}

function printWeek(){
  var wk=getWk(),cm=cMap(),wCA=totalCA(function(d){return wk.includes(d)});
  var html='<h2 style="margin-bottom:4px">Planning '+fmt(wk[0])+' → '+fmt(wk[3])+'</h2><p style="color:#64748b;margin-bottom:16px">CA: <b style="color:#16a34a">'+wCA.toLocaleString('fr-CH')+' CHF</b></p>';
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">';
  wk.forEach(function(d,i){var ids=sch[d]||[],dCA=totalCA(function(x){return x===d});html+='<div style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden"><div style="background:#6366f1;color:#fff;padding:7px;font-size:11px;font-weight:700">'+['Mar','Mer','Jeu','Ven'][i]+' '+fmt(d)+'<br><span style="opacity:.8;font-size:9px">'+ids.length+'/14'+(dCA>0?' · '+dCA.toLocaleString('fr-CH')+' CHF':'')+'</span></div>';ids.forEach(function(id){var c=cm[id];if(!c)return;var v=vis[id]||{},a=parseFloat(v.amount)||0,st=v.status||'',ico={visited:'✓',absent:'~',closed:'✕',callback:'↩'}[st]||'○',bg={visited:'#f0fdf4',absent:'#fffbeb',closed:'#fef2f2'}[st]||'#fff';html+='<div style="padding:4px 6px;border-bottom:1px solid #f1f5f9;font-size:9px;background:'+bg+'"><b>'+ico+' '+sal(c)+(book[id]?' 📖':'')+'</b>'+(a>0?' <span style="float:right;color:#16a34a">'+a.toLocaleString('fr-CH')+'</span>':'')+'</div>'});if(!ids.length)html+='<div style="padding:8px;text-align:center;color:#94a3b8;font-size:9px">— vide —</div>';html+='</div>';});html+='</div>';showPrintOv('Planning',html);
}
function printClients(){
  var ac=actC().sort(function(a,b){return(a.ort||'').localeCompare(b.ort||'')});
  var html='<h2 style="margin-bottom:16px">Clients ('+ac.length+')</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:#6366f1;color:#fff"><th style="padding:6px">Salon</th><th>Ville</th><th>Tél</th><th>Statut</th><th>CHF</th><th>📖</th></tr>';
  ac.forEach(function(c,i){var v=vis[c.kd_nr]||{},a=parseFloat(v.amount)||0,st=v.status||'',ico={visited:'✓',absent:'~',closed:'✕',callback:'↩'}[st]||'○';html+='<tr style="background:'+(i%2?'#f8fafc':'#fff')+'"><td style="padding:5px 6px;font-weight:600">'+sal(c)+'</td><td style="padding:5px 6px">'+c.ort+'</td><td style="padding:5px 6px">'+c.tel+'</td><td style="padding:5px 6px">'+ico+'</td><td style="padding:5px 6px;text-align:right;color:#16a34a;font-weight:600">'+(a>0?a.toLocaleString('fr-CH'):'')+'</td><td style="padding:5px 6px;text-align:center">'+(book[c.kd_nr]?'📖':'')+'</td></tr>'});
  html+='</table>';showPrintOv('Clients',html);
}
function printCA(){
  var cmds=Object.entries(vis).filter(function(e){return e[1].status==='visited'&&parseFloat(e[1].amount)>0}).sort(function(a,b){return(b[1].visitDate||'').localeCompare(a[1].visitDate||'')});
  var cm=cMap(),tot=0;
  var html='<h2 style="margin-bottom:16px">Rapport CA</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:#16a34a;color:#fff"><th style="padding:6px">Date</th><th>Salon</th><th>Ville</th><th>Produits</th><th>CHF</th></tr>';
  cmds.forEach(function(e,i){var c=cm[e[0]],v=e[1],a=parseFloat(v.amount)||0;tot+=a;html+='<tr style="background:'+(i%2?'#f0fdf4':'#fff')+'"><td style="padding:5px 6px">'+fmtL(v.visitDate)+'</td><td style="padding:5px 6px;font-weight:600">'+(c?sal(c):e[0])+'</td><td style="padding:5px 6px">'+(c?c.ort:'')+'</td><td style="padding:5px 6px">'+(v.products||'')+'</td><td style="padding:5px 6px;text-align:right;font-weight:600;color:#16a34a">'+a.toLocaleString('fr-CH')+'</td></tr>'});
  html+='<tr style="font-weight:700;border-top:2px solid #e2e8f0"><td colspan="4" style="padding:8px">TOTAL</td><td style="padding:8px;text-align:right;color:#16a34a;font-size:14px">'+tot.toLocaleString('fr-CH')+' CHF</td></tr></table>';
  showPrintOv('CA',html);
}

try {
  render();
} catch(err) {
  var app=document.getElementById('app');
  if(app) app.innerHTML='<div style="padding:20px;font-family:sans-serif">'
    +'<h2 style="color:#dc2626">Erreur: '+err.message+'</h2>'
    +'<pre style="font-size:11px;color:#64748b;white-space:pre-wrap">'+err.stack+'</pre>'
    +'</div>';
}
</script>
</body>
</html>
