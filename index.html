<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Inter',sans-serif;background:#0a0f1e;color:#f1f5f9;min-height:100vh;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
input,select,textarea{font-family:inherit;font-size:16px!important;color-scheme:dark}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.card{transition:transform .12s;cursor:pointer;-webkit-user-select:none}
.card:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;cursor:pointer;border-radius:10px;font-weight:600;transition:.15s;font-size:14px}
.bg{background:transparent;border:1px solid #334155;color:#94a3b8;cursor:pointer;border-radius:8px;transition:.15s;font-size:13px}
.bg:active{background:rgba(99,102,241,.15);border-color:#6366f1;color:#a5b4fc}
.bd{background:transparent;border:1px solid #ef444433;color:#f87171;cursor:pointer;border-radius:7px;font-size:12px;padding:4px 9px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.r-visited{box-shadow:0 0 0 3px #22c55e}.r-absent{box-shadow:0 0 0 3px #f59e0b}
.r-closed{box-shadow:0 0 0 3px #ef4444}.r-callback{box-shadow:0 0 0 3px #8b5cf6}.r-none{box-shadow:0 0 0 2px #334155}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:#0f172a;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:93vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.6);border-top:1px solid #1e293b}
.sheet-h{padding:0 18px 12px;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#0f172a;z-index:1}
.sheet-b{padding:14px 18px 40px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:10px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.fi{width:100%;background:#060d1a;border:1px solid #1e293b;color:#f1f5f9;padding:10px 12px;border-radius:9px;outline:none}
.day-col{background:#0f172a;border-radius:10px;border:1px solid #1e293b;padding:8px 6px;display:flex;flex-direction:column;gap:3px;min-height:110px}
.day-col.today{border-color:#6366f140;background:rgba(99,102,241,.06)}
.rdv-tag{font-size:9px;background:rgba(245,158,11,.15);color:#f59e0b;border-radius:4px;padding:2px 4px;font-weight:600;margin:1px 0;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{border-radius:5px;padding:4px 5px;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:10px;border:1px solid transparent;-webkit-user-select:none}
.cc:active{opacity:.7}
.nav-bar{display:flex;background:#0f172a;border-top:1px solid #1e293b;position:fixed;bottom:0;left:0;right:0;z-index:90;padding-bottom:env(safe-area-inset-bottom,10px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;cursor:pointer;font-size:10px;color:#64748b;border:none;background:none}
.nb.on{color:#6366f1}
.nb .ic{font-size:20px}
</style>

function load(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch{return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function loadSch(){
  const s=load(SCK)||{},m={...PRELOAD_SCHEDULE};
  Object.keys(s).forEach(d=>{if(s[d]&&s[d].length)m[d]=s[d]});
  return m;
}

let vis=load(SK)||{},del=load(DK)||{},sch=loadSch(),extra=load(EK)||[];
let view='week',wkOff=0,modal=null,toast=null,tTimer=null;
let srch='',fCity='Toutes',fStat='Tous',fSek='Tous';

function toStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`}
function today(){return toStr(new Date())}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function wkMon(d){const x=new Date(d),dy=x.getDay();x.setDate(x.getDate()+(dy===0?-6:1-dy));x.setHours(0,0,0,0);return x}
function fmtFR(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('fr-CH',{weekday:'short',day:'2-digit',month:'2-digit'})}
function ini(n,v){return([v,n].filter(Boolean).map(p=>p[0]?.toUpperCase()).filter(Boolean).slice(0,2).join(''))||'?'}
function sal(c){return c.salon||c.name||'Salon'}
function cname(c){return c.vorname?`${c.vorname} ${c.name}`:c.name}
function getWkDates(){const mon=wkMon(new Date()),tue=addD(mon,1+wkOff*7);return Array.from({length:4},(_,i)=>toStr(addD(tue,i)))}
function allC(){const b=new Set(CR.map(c=>c.kd_nr));return[...CR,...extra.filter(c=>!b.has(c.kd_nr))]}
function activeC(){return allC().filter(c=>!del[c.kd_nr])}
function cMap(){const m={};allC().forEach(c=>{m[c.kd_nr]=c});return m}
function persist(){save(SK,vis);save(DK,del);save(SCK,sch);save(EK,extra)}

function showToast(msg,type='ok'){
  if(tTimer)clearTimeout(tTimer);
  toast={msg,type};render();
  tTimer=setTimeout(()=>{toast=null;render()},2600);
}

function exportSync(){
  const data={vis,del,sch,extra,at:new Date().toISOString(),v:1};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tournee_sync_${today()}.json`;a.click();
  showToast('Fichier sync exporté !');
}
function importSync(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.v)throw new Error('Format invalide');
      vis=d.vis||{};del=d.del||{};extra=d.extra||[];
      const m={...PRELOAD_SCHEDULE};
      if(d.sch)Object.keys(d.sch).forEach(dt=>{if(d.sch[dt]&&d.sch[dt].length)m[dt]=d.sch[dt]});
      sch=m;persist();showToast(`Sync importée - ${Object.keys(vis).length} visites`);render();
    }catch(err){showToast('Erreur: '+err.message,'err');}
  };r.readAsText(file);
}

async function exportExcel(){
  showToast('Génération Excel...','warn');
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  await new Promise((res,rej)=>{script.onload=res;script.onerror=rej;document.head.appendChild(script)});
  const X=window.XLSX,wb=X.utils.book_new(),cm=cMap(),dn=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const rows=[['SEK','N° Client','Nom','Prénom','Salon','Adresse','NPA','Ville','Tél','CA 2025','CA 2024','Diff','Statut','Date visite','Motif','Produits','Commande CHF','Notes','Prochaine action','Date relance','Planifié','Supprimé']];
  allC().forEach(c=>{const v=vis[c.kd_nr]||{};const d=del[c.kd_nr];
    const sc=Object.entries(sch).filter(([,ids])=>ids.includes(c.kd_nr)).map(([dt])=>dt).join(', ');
    rows.push([c.sek,c.kd_nr,c.name,c.vorname||'',c.salon||'',c.strasse||'',c.plz||'',c.ort||'',c.tel||'',parseInt(c.ca_2025)||0,parseInt(c.ca_2024)||0,parseInt(c.diff)||0,v.status||'',v.visitDate||'',v.reason||'',v.products||'',parseFloat(v.amount)||0,v.note||'',v.nextAction||'',v.followUpDate||'',sc,d?'Oui':'Non']);
  });
  const ws1=X.utils.aoa_to_sheet(rows);ws1['!cols']=[6,9,18,14,24,22,6,16,14,9,9,8,12,12,18,20,10,30,24,12,24,6].map(w=>({wch:w}));
  X.utils.book_append_sheet(wb,ws1,'Clients & Visites');
  const pr=[['Date','Jour','N° Client','Salon','Ville','Statut','CHF','Notes']];
  Object.entries(sch).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,ids])=>{
    if(!ids||!ids.length)return;const djn=dn[new Date(date+'T00:00:00').getDay()];
    ids.forEach(id=>{const c=cm[id];if(!c)return;const v=vis[id]||{};
      pr.push([date,djn,id,sal(c),c.ort,v.status||'planifié',parseFloat(v.amount)||0,v.note||'']);});
  });
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(pr),'Planning');
  X.writeFile(wb,`Tournee_${today()}.xlsx`);showToast('Excel téléchargé !');
}

function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el[k.toLowerCase()]=v;
    else if(k==='className')el.className=v;
    else el.setAttribute(k,v);
  });
  ch.flat(9).forEach(c=>{if(c==null||c===false||c===undefined)return;el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});
  return el;
}

  const g=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}});
  kpis.forEach(k=>g.appendChild(h('div',{style:{background:'#0f172a',borderRadius:10,padding:'11px 12px',border:'1px solid #1e293b',borderLeft:'3px solid '+k.c}},h('div',{style:{fontSize:18,marginBottom:2}},k.i),h('div',{style:{fontWeight:800,fontSize:17,color:k.c}},k.v),h('div',{style:{fontSize:10,color:'#475569',marginTop:2}},k.l))));
  wrap.appendChild(g);
  const wkBars=wkDates.map(d=>({d,label:['Mar','Mer','Jeu','Ven'][wkDates.indexOf(d)],ca:Object.values(vis).filter(v=>v.visitDate===d&&v.status==='visited').reduce((s,v)=>s+(parseFloat(v.amount)||0),0)}));
  const maxCA=Math.max(...wkBars.map(x=>x.ca),1);
  const chart=h('div',{style:{background:'#0f172a',borderRadius:10,padding:'12px',border:'1px solid #1e293b',marginBottom:10}});
  chart.appendChild(h('div',{style:{fontWeight:700,fontSize:13,marginBottom:10}},'💵 CA par jour'));
  const bars=h('div',{style:{display:'flex',gap:6,alignItems:'flex-end',height:70}});
  wkBars.forEach(({d,label,ca})=>{
    const isT=d===td,pct=ca>0?Math.round((ca/maxCA)*100):0;
    bars.appendChild(h('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
      h('div',{style:{fontSize:9,fontWeight:700,color:ca>0?'#22c55e':'#334155'}},ca>0?ca.toLocaleString('fr-CH'):'—'),
      h('div',{style:{width:'100%',background:'#1e293b',borderRadius:5,height:45,display:'flex',alignItems:'flex-end',overflow:'hidden'}},h('div',{style:{width:'100%',height:pct+'%',background:isT?'#22c55e':'#6366f1',minHeight:ca>0?3:0}})),
      h('div',{style:{fontSize:9,color:isT?'#a5b4fc':'#475569',fontWeight:isT?700:400}},label)));
  });
  chart.appendChild(bars);wrap.appendChild(chart);
  if(fups.length){
    const rel=h('div',{style:{background:'#0f172a',borderRadius:10,padding:'12px',border:'1px solid #f59e0b33'}});
    rel.appendChild(h('div',{style:{fontWeight:700,fontSize:13,marginBottom:8,color:'#f59e0b'}},'📅 Relances à effectuer'));
    fups.slice(0,6).forEach(c=>rel.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#060d1a',borderRadius:8,padding:'8px 10px',marginBottom:5},onClick:()=>{modal={type:'visit',client:c};render()}},
      h('div',null,h('div',{style:{fontWeight:600,fontSize:12}},sal(c)),h('div',{style:{fontSize:10,color:'#475569'}},c.ort)),
      h('div',{style:{color:'#f59e0b',fontWeight:700,fontSize:11}},fmtFR(vis[c.kd_nr].followUpDate)))));
    wrap.appendChild(rel);
  }
  return wrap;
}

    }

        onClick:()=>{vis[c.kd_nr]={...v,status:k,visitDate:v.visitDate||today()};persist();modal={type:'visit',client:c};render();}},cfg.i+' '+cfg.l));
    });
    body.appendChild(h('div',null,h('div',{className:'fl'},'Statut'),stBtns));

    const dr=h('div',{style:{display:'flex',gap:8}});
    [[{l:'Date de visite',k:'visitDate'}],...(['absent','closed','callback'].includes(v.status)?[[{l:'📅 À revisiter le',k:'followUpDate',c:'#f59e0b'}]]:[])].flat().forEach(({l,k,c:col})=>{

    const prodW=h('div',null,h('div',{className:'fl'},'Produits / commande'));

    const noteW=h('div',null,h('div',{className:'fl'},'Notes'));
    const noteTA=h('textarea',{rows:3,placeholder:'Observations, besoins…',className:'fi',style:{resize:'vertical'},onInput:e=>{vis[c.kd_nr]={...vis[c.kd_nr],note:e.target.value};persist();}},v.note||'');

    body.appendChild(h('div',{style:{display:'flex',gap:8}},
      c.strasse?h('a',{href:'https://maps.apple.com/?address='+encodeURIComponent(c.strasse+' '+c.plz+' '+c.ort),target:'_blank',style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:5,background:'rgba(99,102,241,.1)',border:'1px solid rgba(99,102,241,.25)',color:'#a5b4fc',padding:'10px',borderRadius:9,textDecoration:'none',fontSize:12,fontWeight:600}},'🗺️ Plans Apple'):'',

    body.appendChild(h('button',{className:'bp',style:{width:'100%',padding:'12px',fontSize:14},onClick:()=>{modal=null;showToast('Visite enregistrée \u2713');}},'💾 Enregistrer & fermer'));

  } else if(modal.type==='newclient'){

        h('button',{style:{background:'rgba(255,255,255,.1)',border:'none',color:'#fff',width:26,height:26,borderRadius:7,cursor:'pointer',fontSize:12},onClick:()=>{modal=null;render();}},'✕'))));

        extra=[...extra,{...form,kd_nr:kd,_manual:true}];

    sheet.appendChild(body);

}
